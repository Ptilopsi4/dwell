name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # No model key in CI: smoke runs on the faux provider to exercise storage/tools/checkpoint wiring
      - run: npm run smoke
        env:
          DWELL_DATA: ${{ runner.temp }}/data
          DWELL_STATE: ${{ runner.temp }}/state
