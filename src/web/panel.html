<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dwell panel</title>
<link href="/vendor/basecoat.cdn.min.css" rel="stylesheet">
<style>
/* 布局骨架（Basecoat CDN 不含通用工具类，布局自管；颜色一律走 Basecoat 语义 token） */
html, body { height: 100%; }
body {
	display: flex; overflow: hidden;
	background: var(--background); color: var(--foreground);
	font: 14px/1.7 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
}
#side {
	width: 264px; flex: none; display: flex; flex-direction: column;
	border-right: 1px solid var(--border); background: var(--card); min-height: 0;
}
#side .brand {
	padding: .85rem 1rem .7rem; display: flex; align-items: center; gap: .55rem;
	border-bottom: 1px solid var(--border);
}
#side .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); }
#side .brand .dot.off { background: var(--destructive); }
#side .brand small { color: var(--muted-foreground); }
#convlist { flex: 1; overflow-y: auto; padding: .5rem; min-height: 0; }
.conv {
	padding: .5rem .7rem; cursor: pointer; border-radius: var(--radius-md); margin-bottom: 2px;
	border: 1px solid transparent;
}
.conv:hover { background: var(--accent); }
.conv.active { background: var(--accent); border-color: var(--border); }
.conv .name {
	font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.conv .sub { font: 11px ui-monospace, Consolas, monospace; color: var(--muted-foreground); margin-top: 1px; }
.conv.archived { opacity: .45; }
.sidefoot { padding: .5rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: .25rem; align-items: stretch; }
.sidefoot .btn { justify-content: flex-start; }
#approvals { max-height: 32%; overflow-y: auto; padding: .6rem .75rem; border-top: 1px solid var(--border); }
#approvals .cap { font: 600 12px ui-monospace, Consolas, monospace; color: var(--primary); margin-bottom: .4rem; }
.appr { border-left: 3px solid var(--primary); padding: .25rem 0 .4rem .6rem; margin-bottom: .5rem; }
.appr .cmd {
	font: 11.5px ui-monospace, Consolas, monospace; color: var(--muted-foreground);
	white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.appr .ops { margin-top: .35rem; display: flex; flex-wrap: wrap; gap: .4rem; }
#mainArea { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#topbar {
	display: flex; align-items: center; gap: .5rem;
	padding: .55rem 1.1rem; border-bottom: 1px solid var(--border);
}
#topbar .title { font-weight: 600; }
#topbar .spacer { flex: 1; }
main { flex: 1; overflow-y: auto; padding: 1rem 1.25rem 1.5rem; }
main .empty { color: var(--muted-foreground); text-align: center; padding: 3rem 0; }
.msg { display: grid; grid-template-columns: 72px 1fr; gap: .8rem; padding: .45rem 0; }
.msg + .msg { border-top: 1px solid var(--border); }
.msg .who { font: 600 11.5px/1.4 ui-monospace, Consolas, monospace; text-align: right; color: var(--muted-foreground); user-select: none; }
.msg .when { display: block; font: 10px/1.5 ui-monospace, Consolas, monospace; font-weight: 400; opacity: .7; }
.msg.user .who { color: var(--primary); }
.msg.dwell .who { color: var(--foreground); }
.msg .body { white-space: pre-wrap; word-break: break-word; min-width: 0; }
.msg.user .body { border-left: 2px solid var(--primary); padding-left: .6rem; }
.msg.dwell .body { max-width: 84ch; }
.msg.tool .body { font: 12.5px/1.6 ui-monospace, Consolas, monospace; color: var(--muted-foreground); }
.msg.tool.result .body { color: var(--foreground); opacity: .82; }
.msg.tool.err .body { color: var(--destructive); }
.msg .meta { font-size: .72rem; color: var(--muted-foreground); grid-column: 2; }
.codeblk {
	font: 12.5px/1.6 ui-monospace, Consolas, monospace; display: block;
	padding: .5rem .75rem; background: var(--muted); border-radius: var(--radius-md);
	white-space: pre-wrap; margin: .25rem 0; border: 1px solid var(--border);
}
.code-inline {
	font: 12.5px ui-monospace, Consolas, monospace; background: var(--muted);
	padding: .1rem .3rem; border-radius: var(--radius-sm); border: 1px solid var(--border);
}
@keyframes r { to { transform: rotate(360deg); } }
footer { padding: .7rem 1rem; border-top: 1px solid var(--border); display: flex; gap: .5rem; flex: none; align-items: flex-end; }
#input { flex: 1; resize: none; min-height: 42px; max-height: 160px; }
#toasts { position: fixed; right: 1rem; bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; z-index: 50; }
.toast-item {
	background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border);
	border-radius: var(--radius-md); padding: .55rem .9rem; font-size: 13px;
	box-shadow: 0 4px 16px rgb(0 0 0 / .25);
}
.toast-item.err { border-color: var(--destructive); }
dialog.dialog { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--popover); color: var(--popover-foreground); padding: 0; min-width: min(440px, 92vw); }
dialog.dialog::backdrop { background: rgb(0 0 0 / .5); }
.dlg-body { padding: 1.1rem 1.2rem; }
.dlg-body h6 { margin: 0 0 .8rem; font-weight: 600; }
.dlg-row { display: flex; gap: .5rem; justify-content: flex-end; margin-top: .9rem; }
.urow { display: flex; align-items: center; gap: .5rem; padding: .45rem 0; border-top: 1px solid var(--border); font: 12.5px ui-monospace, Consolas, monospace; }
.urow .mid { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* UX 打磨 */
.conv .tail { font-size: 10.5px; color: var(--muted-foreground); opacity: .8; white-space: nowrap; }
.conv .row1 { display: flex; align-items: baseline; gap: 6px; }
#convlist .conv { display: block; }
#topbar .menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 168px;
  background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 4px; box-shadow: 0 6px 24px rgb(0 0 0 / .28);
}
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; border-radius: var(--radius-sm);
  padding: 7px 10px; background: none; border: none; color: inherit; font: 13px inherit; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--accent); }
.menu button.danger { color: var(--destructive); }
#runbar { display: none; align-items: center; gap: 8px; padding: 6px 1.25rem; border-top: 1px solid var(--border);
  color: var(--muted-foreground); font: 12px ui-monospace, Consolas, monospace; flex: none; }
#runbar.on { display: flex; }
#runbar .spin { width: 10px; height: 10px; border: 2px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: r .9s linear infinite; }
#runbar button { margin-left: auto; }
#inlappr { display: none; padding: 10px 1.25rem; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--primary) 7%, transparent); flex: none; }
#inlappr.on { display: block; }
#inlappr .cap { font: 600 12.5px ui-monospace, Consolas, monospace; color: var(--primary); }
#inlappr .cmd { font: 11.5px ui-monospace, Consolas, monospace; color: var(--muted-foreground); margin: 3px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#inlappr .ops { display: flex; gap: 6px; }
#tobottom {
  position: absolute; right: 24px; bottom: 120px; z-index: 30; display: none;
  background: var(--popover); border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 14px; font-size: 12.5px; cursor: pointer; color: var(--popover-foreground);
  box-shadow: 0 4px 14px rgb(0 0 0 / .22);
}
#tobottom.on { display: block; }
#mainArea { position: relative; }
.msg { position: relative; }
.msg .copy { visibility: hidden; position: absolute; top: 4px; right: 0; border: none; background: none; color: var(--muted-foreground); cursor: pointer; font-size: 11px; padding: 0 2px; }
.msg:hover .copy, .msg:focus-within .copy { visibility: visible; }
.confirm-inline { color: var(--destructive) !important; font-weight: 600; }

@media (max-width: 720px) {
  #side { position: fixed; inset: 0 auto 0 0; z-index: 60; transform: translateX(-100%); transition: transform .18s ease; box-shadow: 0 0 32px rgb(0 0 0 / .35); }
  /* 类名避开 Basecoat 的 .drawer 组件 */
  body.side-open #side { transform: none; }
  body.side-open #scrim { display: block; }
  #drawerBtn { display: inline-flex !important; }
  main { padding: .75rem .8rem 1.2rem; }
  .msg { grid-template-columns: 48px 1fr; gap: .5rem; }
}
#drawerBtn { display: none; }
#scrim { display: none; position: fixed; inset: 0; z-index: 55; background: rgb(0 0 0 / .4); }
.msg.streaming .body { opacity: .8; }
.msg.streaming .who::after { content: " …"; }
</style>
</head>
<body>
<aside id="side">
	<div class="brand">
		<span class="dot off" id="statusDot"></span>
		<span style="font-weight:600">dwell</span>
		<small id="status">连接中</small>
	</div>
	<div id="convlist"></div>
	<div id="approvals" hidden>
		<div class="cap">需要你的审批</div>
		<div id="apprList"></div>
	</div>
	<div class="sidefoot" style="flex-direction:row">
		<button class="btn" data-variant="outline" data-size="sm" id="newConv" style="flex:1">＋ 新会话</button>
		<button class="btn" data-variant="ghost" data-size="icon-sm" id="usersBtn" title="用户管理">👤</button>
		<button class="btn" data-variant="ghost" data-size="icon-sm" id="theme" title="切换主题">◐</button>
	</div>
</aside>
<div id="mainArea">
	<div id="topbar">
		<button class="btn" data-variant="ghost" data-size="icon-sm" id="drawerBtn" title="会话列表">☰</button>
		<span class="title" id="convTitle">—</span>
		<span class="badge" data-variant="secondary" id="convType"></span>
		<span class="spacer"></span>
		<div class="menu-wrap">
			<button class="btn" data-variant="ghost" data-size="icon-sm" id="menuBtn" title="会话操作">⋯</button>
			<div class="menu" id="menu" hidden>
				<button id="renameBtn">重命名</button>
				<button id="archiveBtn">归档</button>
				<button id="resetBtn" class="danger">清空上下文</button>
			</div>
		</div>
	</div>
	<main id="main"><div class="empty">选择左侧会话线<br><small>或点击「＋ 新会话」开始</small></div></main>
<button id="tobottom" title="回到底部">↓ 底部</button>
<div id="runbar"><span class="spin"></span><span id="runText">运行中</span><button class="btn" data-variant="outline" data-size="xs" id="stopRun">停止</button></div>
<div id="inlappr"><div class="cap">需要你的审批</div><div class="cmd"></div>
	<div class="ops">
		<button class="btn" data-variant="outline" data-size="xs" data-a="approve10">批准 10 分钟</button>
		<button class="btn" data-variant="outline" data-size="xs" data-a="approve30">30 分钟</button>
		<button class="btn" data-variant="outline" data-size="xs" data-a="deny" style="color:var(--destructive)">拒绝</button>
	</div>
</div>
	<footer>
		<textarea class="textarea" id="input" placeholder="输入消息，Enter 发送 / Shift+Enter 换行" rows="1"></textarea>
		<button class="btn" data-size="sm" id="send">发送</button>
	</footer>
</div>

<div id="scrim"></div>
<dialog class="dialog" id="sheet">
	<form class="dlg-body" method="dialog">
		<h6 id="sheetTitle"></h6>
		<div id="sheetBody"></div>
	</form>
</dialog>
<div id="toasts"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
// token 首次由 URL 带入，服务端已换发 HttpOnly cookie；从地址栏移除，避免进历史/截图/分享链接
if (params.has("token")) {
	const clean = new URLSearchParams(params);
	clean.delete("token");
	history.replaceState(null, "", location.pathname + (clean.toString() !== "" ? `?${clean}` : ""));
}
const HEAD = { "content-type": "application/json" };
const api = async (path, body) => {
	const res = await fetch(`/api/${path}`, body === undefined ? {} : { method: "POST", headers: HEAD, body: JSON.stringify(body) });
	if (!res.ok) {
		const text = await res.text();
		let msg = text;
		try { msg = JSON.parse(text).error ?? text; } catch { /* 非 JSON 原样显示 */ }
		throw new Error(`${res.status} ${msg}`);
	}
	return res.json();
};
const TYPE_ZH = { direct: "私聊", group: "群", thread: "话题", panel: "panel" };
let convs = [], convId = null, es = null, rendered = new Set(), sending = false, showArchived = false;
let convSig = "", apprSig = "", streamEl = null;

/* 主题：.dark class（Basecoat token 随之切换）；未手动选择时跟随系统 */
const sysTheme = matchMedia("(prefers-color-scheme: light)");
const applyTheme = (t, remember) => {
	document.documentElement.classList.toggle("dark", t === "dark");
	$("theme").textContent = t === "dark" ? "◐" : "◑";
	$("theme").title = t === "dark" ? "切换浅色" : "切换深色";
	if (remember) localStorage.setItem("dwell-theme", t);
};
applyTheme(params.get("theme") ?? localStorage.getItem("dwell-theme") ?? (sysTheme.matches ? "light" : "dark"), false);
sysTheme.addEventListener("change", (e) => { if (localStorage.getItem("dwell-theme") === null) applyTheme(e.matches ? "light" : "dark", false); });
$("theme").onclick = () => applyTheme(document.documentElement.classList.contains("dark") ? "light" : "dark", true);

/* 窄屏抽屉 */
const drawer = (open) => document.body.classList.toggle("side-open", open);
$("drawerBtn").onclick = () => drawer(true);
$("scrim").onclick = () => drawer(false);

function relTime(ts) {
	if (!ts) return "";
	const d = Date.now() - ts;
	if (d < 60e3) return "刚刚";
	if (d < 3600e3) return Math.floor(d / 60e3) + "分前";
	if (d < 86400e3) return Math.floor(d / 3600e3) + "时前";
	return Math.floor(d / 86400e3) + "天前";
}
function toast(msg, err) {
	const el = document.createElement("div");
	el.className = "toast-item" + (err ? " err" : "");
	el.textContent = msg;
	$("toasts").appendChild(el);
	setTimeout(() => el.remove(), 2800);
}

/* 弹层（原生 dialog） */
const sheetPrompt = (title, initial, onOk) => {
	$("sheetTitle").textContent = title;
	$("sheetBody").innerHTML = `
		<input class="input" type="text" id="sheetIn" style="width:100%">
		<div class="dlg-row">
			<button class="btn" data-variant="outline" data-size="sm" value="cancel" type="submit">取消</button>
			<button class="btn" data-size="sm" id="sheetOk" type="button">确定</button>
		</div>`;
	const input = $("sheetIn");
	input.value = initial ?? "";
	$("sheet").showModal();
	input.focus(); input.select();
	$("sheetOk").onclick = () => {
		const v = input.value.trim();
		if (v !== "") { $("sheet").close(); onOk(v); }
	};
	input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); $("sheetOk").click(); } });
};
const sheetConfirm = (title, onOk) => {
	$("sheetTitle").textContent = title;
	$("sheetBody").innerHTML = `
		<div class="dlg-row" style="margin-top:.2rem">
			<button class="btn" data-variant="outline" data-size="sm" value="cancel" type="submit">取消</button>
			<button class="btn" data-variant="destructive" data-size="sm" id="sheetOk" type="button">确定</button>
		</div>`;
	$("sheet").showModal();
	$("sheetOk").onclick = () => { $("sheet").close(); onOk(); };
};

/* 会话列表：结构未变时只刷新相对时间，不重建 DOM（保滚动/悬停/焦点） */
const convLabel = (c) => (c.name !== c.key ? c.name : c.key.replace(/^oc_/, "").slice(0, 20) + "…");
async function loadConvs(keep) {
	convs = await api("conversations");
	const box = $("convlist");
	const visible = convs.filter((c) => showArchived || !c.archived);
	visible.sort((a, b) => (b.lastTs ?? 0) - (a.lastTs ?? 0));
	const sig = JSON.stringify([showArchived, visible.map((c) => [c.id, c.name, c.archived, c.type])]);
	if (sig !== convSig) {
		convSig = sig;
		const scroll = box.scrollTop;
		box.replaceChildren();
		for (const c of visible) {
			const el = document.createElement("div");
			el.className = "conv" + (c.archived ? " archived" : "");
			el.dataset.id = String(c.id);
			el.innerHTML = `<div class="row1"><span class="name" style="flex:1;min-width:0"></span><span class="tail"></span></div><div class="sub"></div>`;
			el.querySelector(".name").textContent = convLabel(c);
			el.querySelector(".sub").textContent = `${TYPE_ZH[c.type] ?? c.type} #${c.id}${c.archived ? " 已归档" : ""}`;
			el.title = c.key;
			el.onclick = () => { drawer(false); if (String(c.id) !== String(convId)) switchConv(c.id); };
			box.appendChild(el);
		}
		const arch = document.createElement("button");
		arch.className = "btn";
		arch.dataset.variant = "ghost";
		arch.dataset.size = "sm";
		arch.style.justifyContent = "flex-start";
		arch.textContent = showArchived ? "隐藏归档" : "显示归档";
		arch.onclick = () => { showArchived = !showArchived; loadConvs(true); };
		box.appendChild(arch);
		box.scrollTop = scroll;
	}
	for (const c of visible) {
		const el = box.querySelector(`.conv[data-id="${c.id}"]`);
		if (el) el.querySelector(".tail").textContent = relTime(c.lastTs);
	}
	markActive();
	if (!keep && visible.length > 0) {
		const wanted = params.get("conv") ?? localStorage.getItem("dwell-conv");
		const hit = visible.find((c) => String(c.id) === wanted);
		switchConv(hit ? hit.id : visible[0].id);
	}
}
function markActive() {
	for (const el of $("convlist").querySelectorAll(".conv")) el.classList.toggle("active", el.dataset.id === String(convId));
	if (convId === null) return;
	const c = convs.find((x) => String(x.id) === String(convId));
	$("convTitle").textContent = c ? (c.name !== c.key ? c.name : `#${c.id}`) : `#${convId}`;
	$("convType").textContent = c ? (TYPE_ZH[c.type] ?? c.type) : "";
	$("archiveBtn").textContent = c?.archived ? "取消归档" : "归档";
}
function switchConv(id) {
	convId = id;
	localStorage.setItem("dwell-conv", String(id));
	if (es) es.close();
	rendered = new Set();
	streamEl = null;
	$("main").replaceChildren();
	$("runbar").classList.remove("on");
	markActive();
	apprSig = "";
	loadApprovals();
	es = new EventSource(`/api/events?conv=${encodeURIComponent(id)}`);
	es.addEventListener("sync", onSync);
	es.onerror = () => setStatus(false);
}
function setStatus(on) {
	$("status").textContent = on ? "已连接" : "重连中";
	$("statusDot").classList.toggle("off", !on);
}

function onSync(e) {
	setStatus(true);
	render(JSON.parse(e.data));
}

function render(data) {
	const main = $("main");
	const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 48;
	if (data.mode !== "append") {
		// 活动 entries 被替换（清空上下文 / compaction / 重连）：整体重绘
		rendered = new Set();
		main.replaceChildren();
		streamEl = null;
	}
	const empty = main.querySelector(".empty"); if (empty) empty.remove();
	for (const entry of data.entries ?? []) {
		if (rendered.has(entry.id)) continue;
		rendered.add(entry.id);
		let node = null;
		try { node = renderEntry(entry); } catch (err) { console.error("renderEntry", entry.kind, entry.id, err); }
		if (node) main.appendChild(node);
	}
	const live = data.live;
	const running = live !== null && live !== undefined;
	$("runbar").classList.toggle("on", running);
	if (running) {
		const tools = (live.tools ?? []).map((t) => `${t.name}:${t.status}`);
		let txt = tools.length > 0 ? `运行中 ${tools.join(" ")}` : "运行中";
		if (live.retry) txt += ` · 重试：${live.retry}`;
		$("runText").textContent = txt;
	}
	// 流式预览：生成中的文本挂在末尾，定稿 entry 到达后由其替代
	if (running && live.text) {
		if (streamEl === null) {
			streamEl = document.createElement("div");
			streamEl.className = "msg dwell streaming";
			streamEl.innerHTML = `<span class="who">dwell</span><div class="body"></div>`;
		}
		streamEl.querySelector(".body").innerHTML = mdRender(live.text);
		main.appendChild(streamEl);
	} else if (streamEl !== null) {
		streamEl.remove();
		streamEl = null;
	}
	if (main.childElementCount === 0) main.innerHTML = `<div class="empty">暂无消息</div>`;
	if (nearBottom) main.scrollTop = main.scrollHeight;
}

function renderEntry(entry) {
	const msg = (cls, who, body, meta, at) => {
		const el = document.createElement("div");
		el.className = `msg ${cls}`;
		el.innerHTML = `<span class="who"></span><div class="body"></div>`;
		const whoEl = el.querySelector(".who");
		whoEl.textContent = who;
		if (at !== undefined) {
			const w = document.createElement("span");
			w.className = "when";
			w.textContent = new Date(at).toTimeString().slice(0, 5);
			whoEl.appendChild(w);
		}
		el.querySelector(".body").textContent = body;
		if (meta) {
			const m = document.createElement("div"); m.className = "meta"; m.textContent = meta;
			el.appendChild(m);
		}
		return el;
	};
	const model = entry.model?.[0];
	if (entry.kind === "pi.user") {
		const name = entry.data?.senderName || entry.data?.sender || "";
		return msg("user", name ? String(name).slice(0, 8) : "用户", contentText(model?.content), null, model?.timestamp);
	}
	if (entry.kind === "pi.assistant") {
		const parts = model?.content ?? [];
		const text = parts.filter((c) => c.type === "text").map((c) => c.text).join("");
		const calls = parts.filter((c) => c.type === "toolCall");
		// 同一条回复可同时含正文与工具调用；出错/中止时 content 可能为空，原因在 errorMessage
		const frag = document.createDocumentFragment();
		if (text) {
			const el = msg("dwell", "dwell", "", null, model?.timestamp);
			el.querySelector(".body").innerHTML = mdRender(text);
			const cp = document.createElement("button");
			cp.className = "copy"; cp.textContent = "复制";
			cp.onclick = () => { navigator.clipboard.writeText(text).then(() => { cp.textContent = "已复制"; setTimeout(() => (cp.textContent = "复制"), 1500); }); };
			el.appendChild(cp);
			frag.appendChild(el);
		}
		if (calls.length > 0) {
			frag.appendChild(msg("tool call", "tool", calls.map((c) => `${c.name} ${summaryArgs(c.arguments)}`).join("\n"), null, model?.timestamp));
		}
		if (model?.stopReason === "error" || model?.stopReason === "aborted") {
			const why = model.stopReason === "aborted" ? "已中止" : `模型出错：${model.errorMessage ?? "未知错误"}`;
			frag.appendChild(msg("tool err", "dwell", why, null, model?.timestamp));
		}
		return frag.childNodes.length > 0 ? frag : null;
	}
	if (entry.kind === "pi.tool-result") {
		const err = model?.isError === true || (entry.data?.diagnostics ?? []).length > 0;
		const raw = contentText(model?.content);
		let body = raw.length > 400 ? raw.slice(0, 400).replace(/\n[^\n]*$/, "") + "\n…（已截断，共 " + raw.length + " 字符）" : raw;
		if (body === "") body = err ? "（错误，无输出）" : "";
		return msg(err ? "tool err" : "tool result", "↳", body, model?.toolName ?? "", model?.timestamp);
	}
	if (entry.kind === "panel.message" || entry.kind === "chat.message") {
		return msg("user", "用户", contentText(model?.content), null, model?.timestamp);
	}
	return null;
}
function contentText(content) {
	// user 消息的 content 可以是纯字符串（panel/飞书提交）或 content block 数组
	if (typeof content === "string") return content;
	return (content ?? []).flatMap((c) => (c.type === "text" ? [c.text] : [])).join("");
}
function summaryArgs(a) {
	const s = a?.command ?? a?.path ?? JSON.stringify(a) ?? "";
	const t = String(s).replace(/\s+/g, " ");
	return t.length > 72 ? t.slice(0, 72) + "…" : t;
}
function mdRender(text) {
	const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	return esc
		.replace(/```([\s\S]*?)```/g, function (_, c) {
			return `<span class="codeblk">${c.replace(/^\n/, "")}</span>`;
		})
		.replace(/`([^`\n]+)`/g, '<span class="code-inline">$1</span>')
		.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}

/* 发送 */
async function send() {
	const text = $("input").value.trim();
	if (!text || sending || convId === null) return;
	sending = true; $("send").disabled = true;
	try {
		await api("send", { conv: Number(convId), content: text });
		$("input").value = ""; $("input").style.height = "";
	} catch (err) { toast("发送失败 " + err.message, true); }
	sending = false; $("send").disabled = false; $("input").focus();
}
$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
	if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", function () {
	this.style.height = ""; this.style.height = Math.min(this.scrollHeight, 160) + "px";
});

/* 顶栏操作 */
$("resetBtn").onclick = (e) => armConfirm(e.currentTarget, "清空上下文", async () => {
	$("menu").hidden = true;
	try {
		await api("reset", { conv: Number(convId) });
		toast("已开启新对话");
	} catch (err) { toast(err.message, true); }
});
$("stopRun").onclick = (e) => armConfirm(e.currentTarget, "停止", async () => {
	await api("abort", { conv: Number(convId) }).catch((err) => toast(err.message, true));
});
$("archiveBtn").onclick = () => {
	const c = convs.find((x) => String(x.id) === String(convId));
	if (c === undefined) return;
	if (c.archived) {
		api("archive", { id: Number(convId), archived: false }).then(() => loadConvs(true)).catch((e) => toast(e.message, true));
	} else {
		sheetConfirm("归档该会话线？", () => api("archive", { id: Number(convId), archived: true }).then(() => loadConvs(true)).catch((e) => toast(e.message, true)));
	}
};
$("renameBtn").onclick = () => sheetPrompt("重命名会话线", $("convTitle").textContent, async (name) => {
	try {
		await api("rename", { id: Number(convId), name });
		await loadConvs(true);
	} catch (e) { toast(e.message, true); }
});
$("newConv").onclick = () => sheetPrompt("新建会话线", "", async (name) => {
	const r = await api("conversations", { name }).catch((e) => (toast(e.message, true), null));
	if (r) { await loadConvs(true); switchConv(r.id); }
});

/* 审批队列：当前会话的待审只在内联条，侧栏只列其他会话；列表未变不重建 */
const apprConv = (a) => Number(String(a.key).split(":")[0]);
function bindApprOps(root, key) {
	for (const b of root.querySelectorAll("button[data-a]")) {
		b.onclick = async () => {
			const action = b.dataset.a === "deny" ? "deny" : "approve";
			const minutes = b.dataset.a === "approve30" ? 30 : 10;
			const r = await api("approve", { key, action, minutes }).catch((e) => ({ ok: false, error: e.message }));
			if (!r.ok) toast(r.error ?? "操作失败", true);
			else toast(action === "approve" ? "已批准" : "已拒绝");
			apprSig = "";
			loadApprovals();
		};
	}
}
async function loadApprovals() {
	let list;
	try { list = await api("approvals"); } catch { return; /* 轮询失败忽略 */ }
	const sig = JSON.stringify([convId, list.map((a) => a.key)]);
	if (sig === apprSig) return;
	apprSig = sig;
	const mine = list.find((a) => apprConv(a) === Number(convId));
	const inl = $("inlappr");
	inl.classList.toggle("on", mine !== undefined);
	if (mine !== undefined) {
		inl.querySelector(".cmd").textContent = `${mine.match} — ${mine.command.slice(0, 72)}`;
		bindApprOps(inl, mine.key);
	}
	const others = list.filter((a) => a !== mine);
	$("approvals").hidden = others.length === 0;
	const box = $("apprList");
	box.replaceChildren();
	for (const a of others) {
		const el = document.createElement("div");
		el.className = "appr";
		el.innerHTML = `<div class="cmd"></div>
			<div class="ops">
				<button class="btn" data-variant="ghost" data-size="xs" data-go>查看</button>
				<button class="btn" data-variant="outline" data-size="xs" data-a="approve10">批准 10 分钟</button>
				<button class="btn" data-variant="outline" data-size="xs" data-a="approve30">30 分钟</button>
				<button class="btn" data-variant="outline" data-size="xs" data-a="deny" style="color:var(--destructive)">拒绝</button>
			</div>`;
		el.querySelector(".cmd").textContent = `#${apprConv(a)} ${a.match} — ${a.command.slice(0, 60)}`;
		el.querySelector(".cmd").title = a.command;
		el.querySelector("[data-go]").onclick = () => { drawer(false); switchConv(apprConv(a)); };
		bindApprOps(el, a.key);
		box.appendChild(el);
	}
}
setInterval(() => { loadApprovals(); loadConvs(true).catch(() => {}); }, 5000);


/* 用户管理 */
$("usersBtn").onclick = async () => {
	const users = await api("users").catch((e) => (toast(e.message, true), []));
	$("sheetTitle").textContent = "用户管理";
	$("sheetBody").innerHTML = `
		<div style="display:flex;gap:.4rem;margin-bottom:.8rem">
			<input class="input" type="text" id="uId" placeholder="open_id（ou_ 开头）" style="flex:1">
			<button class="btn" data-variant="outline" data-size="sm" id="uAdd">添加成员</button>
			<button class="btn" data-variant="outline" data-size="sm" id="uAddAdmin">管理员</button>
		</div>
		<div id="uList"></div>
		<div class="dlg-row"><button class="btn" data-variant="outline" data-size="sm" value="cancel" type="submit">关闭</button></div>`;
	const list = $("uList");
	if (users.length === 0) list.innerHTML = `<small style="color:var(--muted-foreground)">（暂无用户）</small>`;
	for (const u of users) {
		const row = document.createElement("div");
		row.className = "urow";
		row.innerHTML = `<span class="mid"></span>
			<span class="badge" data-variant="${u.role === "admin" ? "default" : "secondary"}">${u.role === "admin" ? "管理员" : "成员"}</span>
			<button class="btn" data-variant="ghost" data-size="icon-xs" title="移除">✕</button>`;
		row.querySelector(".mid").textContent = u.id;
		row.querySelector("button").onclick = (e) => armConfirm(e.currentTarget, "✕", async () => {
			try {
				await api("users", { id: u.id, action: "remove" });
				$("usersBtn").onclick();
			} catch (err) { toast(err.message, true); }
		}, "确认移除?");
		list.appendChild(row);
	}
	$("sheet").showModal();
	const add = async (role) => {
		const id = $("uId").value.trim();
		if (!id.startsWith("ou_")) { toast("需要 ou_ 开头的 open_id", true); return; }
		await api("users", { id, role }).catch((e) => toast(e.message, true));
		$("usersBtn").onclick();
	};
	$("uAdd").onclick = () => add("member");
	$("uAddAdmin").onclick = () => add("admin");
};

$("menuBtn").onclick = (e) => { e.stopPropagation(); $("menu").hidden = !$("menu").hidden; };
document.addEventListener("click", () => { $("menu").hidden = true; });
$("menu").addEventListener("click", (e) => e.stopPropagation());

/* 回到底部浮标 + 运行条 */
const main = $("main");
main.addEventListener("scroll", () => {
	$("tobottom").classList.toggle("on", main.scrollHeight - main.scrollTop - main.clientHeight > 200);
});
$("tobottom").onclick = () => main.scrollTo({ top: main.scrollHeight, behavior: "smooth" });
const reflowFloat = () => {
	$("tobottom").style.bottom = ($("runbar").offsetHeight + $("inlappr").offsetHeight + 66) + "px";
};
new MutationObserver(reflowFloat).observe($("mainArea"), { subtree: true, attributes: true, attributeFilter: ["class", "hidden"] });
reflowFloat();

/* inline confirm：二次点击确认（替代弹层） */
function armConfirm(btn, label, fn, prompt = "确认" + label + "?") {
	if (btn.dataset.armed === "1") { btn.dataset.armed = ""; btn.classList.remove("confirm-inline"); btn.textContent = label; fn(); return; }
	btn.dataset.armed = "1"; btn.classList.add("confirm-inline"); btn.textContent = prompt;
	setTimeout(() => { if (btn.dataset.armed === "1") { btn.dataset.armed = ""; btn.classList.remove("confirm-inline"); btn.textContent = label; } }, 2500);
}

loadConvs().catch((e) => { setStatus(false); toast("加载会话失败 " + e.message, true); });
</script>
