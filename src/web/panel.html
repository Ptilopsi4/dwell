<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dwell panel</title>
<link href="/vendor/bootstrap.min.css" rel="stylesheet">
<style>
html, body { height: 100%; }
body { display: flex; overflow: hidden; }
#side {
	width: 264px; flex: none; display: flex; flex-direction: column;
	border-right: var(--bs-border-width) solid var(--bs-border-color);
	background: var(--bs-tertiary-bg); min-height: 0;
}
#side .brand {
	padding: .8rem 1rem .6rem; display: flex; align-items: center; gap: .5rem;
	border-bottom: var(--bs-border-width) solid var(--bs-border-color);
}
#side .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bs-success); }
#side .brand .dot.off { background: var(--bs-danger); }
#side .brand small { color: var(--bs-secondary-color); }
#convlist { flex: 1; overflow-y: auto; padding: .5rem .5rem; min-height: 0; }
#convlist .list-group-item { cursor: pointer; border-radius: .375rem; margin-bottom: 2px; padding: .5rem .75rem; }
#convlist .list-group-item .sub { font-size: .72rem; color: var(--bs-secondary-color); }
#convlist .list-group-item.archived { opacity: .45; }
.sidefoot { padding: .5rem; border-top: var(--bs-border-width) solid var(--bs-border-color); display: flex; flex-direction: column; gap: .25rem; }
#approvals { max-height: 32%; overflow-y: auto; padding: .5rem; border-top: var(--bs-border-width) solid var(--bs-border-color); }
#mainArea { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#topbar {
	display: flex; align-items: center; gap: .5rem;
	padding: .5rem 1rem; border-bottom: var(--bs-border-width) solid var(--bs-border-color);
}
#topbar .title { font-weight: 600; }
#topbar .spacer { flex: 1; }
main { flex: 1; overflow-y: auto; padding: 1rem 1.25rem 1.5rem; }
main .empty { color: var(--bs-secondary-color); text-align: center; padding: 3rem 0; }
.msg { display: grid; grid-template-columns: 72px 1fr; gap: .75rem; padding: .45rem 0; }
.msg + .msg { border-top: 1px solid var(--bs-border-color-translucent); }
.msg .who { font: 600 11.5px/1.4 ui-monospace, Consolas, monospace; text-align: right; color: var(--bs-secondary-color); user-select: none; }
.msg .when { display: block; font: 10px/1.5 ui-monospace, Consolas, monospace; font-weight: 400; opacity: .7; }
.msg.user .who { color: var(--bs-warning-text-emphasis); }
.msg.dwell .who { color: var(--bs-link-color); }
.msg .body { white-space: pre-wrap; word-break: break-word; min-width: 0; }
.msg.user .body { border-left: 2px solid var(--bs-warning); padding-left: .6rem; }
.msg.dwell .body { max-width: 84ch; }
.msg.tool .body { font: 12.5px/1.6 ui-monospace, Consolas, monospace; color: var(--bs-secondary-color); }
.msg.tool.result .body { color: var(--bs-body-color); opacity: .82; }
.msg.tool.err .body { color: var(--bs-danger); }
.msg .meta { font-size: .72rem; color: var(--bs-secondary-color); grid-column: 2; }
.codeblk {
	font: 12.5px/1.6 ui-monospace, Consolas, monospace; display: block;
	padding: .5rem .75rem; background: var(--bs-secondary-bg); border-radius: .375rem;
	white-space: pre-wrap; margin: .25rem 0;
}
.code-inline {
	font: 12.5px ui-monospace, Consolas, monospace; background: var(--bs-secondary-bg);
	padding: .1rem .3rem; border-radius: .25rem;
}
#live { display: none; padding: .4rem 1.25rem; border-top: var(--bs-border-width) solid var(--bs-border-color); color: var(--bs-secondary-color); font: 12.5px ui-monospace, Consolas, monospace; flex: none; }
#live.on { display: block; color: var(--bs-warning-text-emphasis); }
.spinner-border-sm { width: .8rem; height: .8rem; border-width: .13em; margin-right: .5rem; vertical-align: -.1rem; }
footer { padding: .7rem 1rem; border-top: var(--bs-border-width) solid var(--bs-border-color); display: flex; gap: .5rem; flex: none; }
#input { flex: 1; resize: none; min-height: 42px; max-height: 160px; }
@media (max-width: 720px) { #side { display: none; } }
</style>
</head>
<body>
<aside id="side">
	<div class="brand">
		<span class="dot off" id="statusDot"></span>
		<span class="fw-semibold">dwell</span>
		<small id="status">连接中</small>
	</div>
	<div id="convlist"></div>
	<div id="approvals" class="d-none">
		<div class="fw-semibold small text-warning-emphasis mb-1">需要你的审批</div>
		<div id="apprList" class="vstack gap-2"></div>
	</div>
	<div class="sidefoot">
		<button class="btn btn-sm btn-outline-secondary text-start" id="newConv">＋ 新会话线</button>
		<button class="btn btn-sm btn-outline-secondary text-start" id="usersBtn">用户管理</button>
		<button class="btn btn-sm btn-outline-secondary text-start" id="theme">浅色</button>
	</div>
</aside>
<div id="mainArea">
	<div id="topbar">
		<span class="title" id="convTitle">—</span>
		<span class="badge text-bg-secondary" id="convType"></span>
		<span class="spacer"></span>
		<div class="btn-group btn-group-sm" role="group">
			<button class="btn btn-outline-secondary" id="renameBtn">重命名</button>
			<button class="btn btn-outline-secondary" id="resetBtn">清空</button>
			<button class="btn btn-outline-danger" id="abortBtn" disabled>中止</button>
			<button class="btn btn-outline-secondary" id="archiveBtn">归档</button>
		</div>
	</div>
	<main id="main"><div class="empty">选择左侧会话线</div></main>
	<div id="live"><span class="spinner-border spinner-border-sm"></span><span id="liveText">运行中</span></div>
	<footer>
		<textarea class="form-control" id="input" placeholder="输入消息，Enter 发送 / Shift+Enter 换行" rows="1"></textarea>
		<button class="btn btn-primary" id="send">发送</button>
	</footer>
</div>

<div class="modal fade" id="sheetModal" tabindex="-1">
	<div class="modal-dialog modal-dialog-centered modal-sm">
		<div class="modal-content">
			<div class="modal-header py-2"><h6 class="modal-title" id="sheetTitle"></h6></div>
			<div class="modal-body" id="sheetBody"></div>
		</div>
	</div>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

<script src="/vendor/bootstrap.bundle.min.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const token = params.get("token") ?? "";
const HEAD = { "x-panel-token": token, "content-type": "application/json" };
const api = async (path, body) => {
	const res = await fetch(`/api/${path}${path.includes("?") ? "&" : "?"}token=${encodeURIComponent(token)}`, body === undefined ? {} : { method: "POST", headers: HEAD, body: JSON.stringify(body) });
	if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
	return res.json();
};
let convs = [], convId = null, es = null, rendered = new Set(), sending = false, showArchived = false;

/* 主题 */
const applyTheme = (t) => {
	document.documentElement.dataset.bsTheme = t;
	$("theme").textContent = t === "dark" ? "浅色" : "深色";
	localStorage.setItem("dwell-theme", t);
};
applyTheme(params.get("theme") ?? localStorage.getItem("dwell-theme") ?? "dark");
$("theme").onclick = () => applyTheme(document.documentElement.dataset.bsTheme === "dark" ? "light" : "dark");

function toast(msg, kind) {
	const el = document.createElement("div");
	el.className = `toast align-items-center text-bg-${kind ?? "secondary"} border-0`;
	el.innerHTML = `<div class="d-flex"><div class="toast-body"></div>
		<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
	el.querySelector(".toast-body").textContent = msg;
	$("toasts").appendChild(el);
	new bootstrap.Toast(el, { delay: 2600 }).show();
	el.addEventListener("hidden.bs.toast", () => el.remove());
}

/* 模态弹层 */
const modal = new bootstrap.Modal("#sheetModal");
const sheetPrompt = (title, initial, onOk) => {
	$("sheetTitle").textContent = title;
	$("sheetBody").innerHTML = `<input type="text" class="form-control form-control-sm" id="sheetIn">
		<div class="d-flex gap-2 mt-3 justify-content-end">
		<button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">取消</button>
		<button class="btn btn-sm btn-primary" id="sheetOk">确定</button></div>`;
	const input = $("sheetBody").querySelector("#sheetIn");
	input.value = initial ?? "";
	modal.show();
	input.focus(); input.select();
	$("sheetBody").querySelector("#sheetOk").onclick = () => {
		const v = input.value.trim();
		if (v !== "") { modal.hide(); onOk(v); }
	};
	input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) $("sheetBody").querySelector("#sheetOk").click(); });
};
const sheetConfirm = (title, onOk) => {
	$("sheetTitle").textContent = title;
	$("sheetBody").innerHTML = `<div class="d-flex gap-2 mt-2 justify-content-end">
		<button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">取消</button>
		<button class="btn btn-sm btn-danger" id="sheetOk">确定</button></div>`;
	modal.show();
	$("sheetBody").querySelector("#sheetOk").onclick = () => { modal.hide(); onOk(); };
};

/* 会话列表 */
async function loadConvs(keep) {
	convs = await api("conversations");
	const box = $("convlist");
	box.innerHTML = "";
	const visible = convs.filter((c) => showArchived || !c.archived);
	for (const c of visible) {
		const el = document.createElement("div");
		el.className = "list-group-item list-group-item-action" + (String(c.id) === String(convId) ? " active" : "") + (c.archived ? " archived" : "");
		const label = c.name !== c.key ? c.name : c.key.replace(/^oc_/, "").slice(0, 20) + "…";
		const typeZh = { direct: "私聊", group: "群", thread: "话题", panel: "panel" }[c.type] ?? c.type;
		el.innerHTML = `<div class="d-flex justify-content-between align-items-center">
			<span class="text-truncate"></span><small class="sub"></small></div>`;
		el.querySelector("span").textContent = label;
		el.querySelector("small").textContent = `${typeZh} #${c.id}${c.archived ? " 已归档" : ""}`;
		el.title = c.key;
		el.onclick = () => switchConv(c.id);
		box.appendChild(el);
	}
	const arch = document.createElement("button");
	arch.className = "btn btn-sm btn-link text-secondary-emphasis text-decoration-none px-2";
	arch.textContent = showArchived ? "隐藏归档" : "显示归档";
	arch.onclick = () => { showArchived = !showArchived; loadConvs(true); };
	box.appendChild(arch);
	if (!keep && visible.length > 0) {
		const wanted = params.get("conv") ?? localStorage.getItem("dwell-conv");
		const hit = visible.find((c) => String(c.id) === wanted);
		switchConv(hit ? hit.id : visible[visible.length - 1].id);
	}
}
function switchConv(id) {
	convId = id;
	localStorage.setItem("dwell-conv", String(id));
	if (es) es.close();
	rendered = new Set();
	$("main").innerHTML = "";
	const c = convs.find((x) => String(x.id) === String(id));
	$("convTitle").textContent = c ? (c.name !== c.key ? c.name : `#${c.id}`) : `#${id}`;
	$("convType").textContent = c ? ({ direct: "私聊", group: "群", thread: "话题", panel: "panel" }[c.type] ?? c.type) : "";
	$("archiveBtn").textContent = c?.archived ? "取消归档" : "归档";
	loadConvs(true);
	es = new EventSource(`/api/events?conv=${id}&token=${encodeURIComponent(token)}`);
	es.addEventListener("sync", onSync);
	es.onerror = () => setStatus(false);
}
function setStatus(on) {
	$("status").textContent = on ? "已连接" : "重连中";
	$("statusDot").classList.toggle("off", !on);
}

function onSync(e) {
	setStatus(true);
	render(JSON.parse(e.data));
}

function render(data) {
	const main = $("main");
	const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 48;
	const empty = main.querySelector(".empty"); if (empty) empty.remove();
	for (const entry of data.entries ?? []) {
		if (rendered.has(entry.id)) continue;
		rendered.add(entry.id);
		const node = renderEntry(entry);
		if (node) main.appendChild(node);
	}
	const live = data.live ?? {};
	const running = live.run !== undefined;
	$("live").classList.toggle("on", running);
	$("abortBtn").disabled = !running;
	if (running) {
		const tools = (live.tools ?? []).map((t) => `${t.name}:${t.status}`);
		$("liveText").textContent = tools.length > 0 ? `运行中 ${tools.join(" ")}` : "运行中";
	}
	if (nearBottom) main.scrollTop = main.scrollHeight;
}

function renderEntry(entry) {
	const msg = (cls, who, body, meta, at) => {
		const el = document.createElement("div");
		el.className = `msg ${cls}`;
		el.innerHTML = `<span class="who"></span><div class="body"></div>`;
		const whoEl = el.querySelector(".who");
		whoEl.textContent = who;
		if (at !== undefined) {
			const w = document.createElement("span");
			w.className = "when";
			w.textContent = new Date(at).toTimeString().slice(0, 5);
			whoEl.appendChild(w);
		}
		el.querySelector(".body").textContent = body;
		if (meta) {
			const m = document.createElement("div"); m.className = "meta"; m.textContent = meta;
			el.appendChild(m);
		}
		return el;
	};
	const model = entry.model?.[0];
	if (entry.kind === "pi.user") {
		const name = entry.data?.senderName || entry.data?.sender || "";
		return msg("user", name ? String(name).slice(0, 8) : "用户", contentText(model?.content), null, model?.timestamp);
	}
	if (entry.kind === "pi.assistant") {
		const parts = model?.content ?? [];
		const text = parts.filter((c) => c.type === "text").map((c) => c.text).join("");
		if (text) {
			const el = msg("dwell", "dwell", "", null, model?.timestamp);
			const body = el.querySelector(".body");
			body.innerHTML = mdRender(text);
			return el;
		}
		const calls = parts.filter((c) => c.type === "toolCall");
		if (calls.length > 0) {
			const el = msg("tool call", "tool", calls.map((c) => `${c.name} ${summaryArgs(c.arguments)}`).join("\n"), null, model?.timestamp);
			return el;
		}
		return null;
	}
	if (entry.kind === "pi.tool-result") {
		const err = (entry.data?.diagnostics ?? []).length > 0;
		const raw = contentText(model?.content);
		let body = raw.length > 400 ? raw.slice(0, 400).replace(/\n[^\n]*$/, "") + "\n…（已截断，共 " + raw.length + " 字符）" : raw;
		if (body === "") body = err ? "（错误，无输出）" : "";
		return msg(err ? "tool err" : "tool result", "↳", body, model?.toolName ?? "", model?.timestamp);
	}
	if (entry.kind === "panel.message" || entry.kind === "chat.message") {
		return msg("user", "用户", contentText(model?.content), null, model?.timestamp);
	}
	return null;
}
function contentText(content) {
	return (content ?? []).flatMap((c) => (c.type === "text" ? [c.text] : [])).join("");
}
function summaryArgs(a) {
	const s = a?.command ?? a?.path ?? JSON.stringify(a) ?? "";
	const t = String(s).replace(/\s+/g, " ");
	return t.length > 72 ? t.slice(0, 72) + "…" : t;
}
function mdRender(text) {
	const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	return esc
		.replace(/```([\s\S]*?)```/g, function (_, c) {
			return `<span class="codeblk">${c.replace(/^\n/, "")}</span>`;
		})
		.replace(/`([^`\n]+)`/g, '<span class="code-inline">$1</span>')
		.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}

/* 发送 */
async function send() {
	const text = $("input").value.trim();
	if (!text || sending || convId === null) return;
	sending = true; $("send").disabled = true;
	try {
		await api("send", { conv: Number(convId), content: text });
		$("input").value = ""; $("input").style.height = "";
	} catch (err) { toast("发送失败 " + err.message, "danger"); }
	sending = false; $("send").disabled = false; $("input").focus();
}
$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
	if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", function () {
	this.style.height = ""; this.style.height = Math.min(this.scrollHeight, 160) + "px";
});

/* 顶栏操作 */
$("resetBtn").onclick = () => sheetConfirm("清空当前会话上下文？", async () => {
	await api("reset", { conv: Number(convId) }).catch((e) => toast(e.message, "danger"));
	toast("已开启新对话");
});
$("abortBtn").onclick = () => sheetConfirm("中止当前任务？", async () => {
	await api("abort", { conv: Number(convId) }).catch((e) => toast(e.message, "danger"));
});
$("archiveBtn").onclick = () => {
	const c = convs.find((x) => String(x.id) === String(convId));
	if (c === undefined) return;
	if (c.archived) {
		api("archive", { id: Number(convId), archived: false }).then(() => loadConvs(true)).catch((e) => toast(e.message, "danger"));
	} else {
		sheetConfirm("归档该会话线？", () => api("archive", { id: Number(convId), archived: true }).then(() => loadConvs(true)).catch((e) => toast(e.message, "danger")));
	}
};
$("renameBtn").onclick = () => sheetPrompt("重命名会话线", $("convTitle").textContent, async (name) => {
	await api("rename", { id: Number(convId), name }).catch((e) => toast(e.message, "danger"));
	loadConvs(true);
});
$("newConv").onclick = () => sheetPrompt("新建会话线", "", async (name) => {
	const r = await api("conversations", { name }).catch((e) => (toast(e.message, "danger"), null));
	if (r) { await loadConvs(); switchConv(r.id); }
});

/* 审批队列 */
async function loadApprovals() {
	try {
		const list = await api("approvals");
		$("approvals").classList.toggle("d-none", list.length === 0);
		const box = $("apprList");
		box.innerHTML = "";
		for (const a of list) {
			const el = document.createElement("div");
			el.className = "border-start border-warning border-3 ps-2";
			el.innerHTML = `<div class="font-monospace small text-body-secondary text-truncate"></div>
				<div class="btn-group btn-group-sm mt-1" role="group">
				<button class="btn btn-outline-warning" data-a="approve10">批准 10 分钟</button>
				<button class="btn btn-outline-warning" data-a="approve30">30 分钟</button>
				<button class="btn btn-outline-danger" data-a="deny">拒绝</button></div>`;
			el.querySelector(".font-monospace").textContent = `${a.match} — ${a.command.slice(0, 60)}`;
			for (const b of el.querySelectorAll("button")) {
				b.onclick = async () => {
					const action = b.dataset.a === "deny" ? "deny" : "approve";
					const minutes = b.dataset.a === "approve30" ? 30 : 10;
					const r = await api("approve", { key: a.key, action, minutes }).catch((e) => ({ ok: false, error: e.message }));
					if (!r.ok) toast(r.error ?? "操作失败", "danger");
					else toast(action === "approve" ? "已批准" : "已拒绝", action === "approve" ? "success" : "secondary");
					loadApprovals();
				};
			}
			box.appendChild(el);
		}
	} catch { /* 轮询失败忽略 */ }
}
setInterval(loadApprovals, 5000);
loadApprovals();

/* 用户管理 */
$("usersBtn").onclick = async () => {
	const users = await api("users").catch(() => []);
	$("sheetTitle").textContent = "用户管理";
	$("sheetBody").innerHTML = `
		<div class="input-group input-group-sm mb-3">
			<input type="text" class="form-control" id="uId" placeholder="open_id（ou_ 开头）">
			<button class="btn btn-outline-secondary" id="uAdd">添加成员</button>
			<button class="btn btn-outline-secondary" id="uAddAdmin">管理员</button>
		</div>
		<div class="vstack gap-1" id="uList"></div>
		<div class="d-flex justify-content-end mt-3"><button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">关闭</button></div>`;
	const list = $("uList");
	if (users.length === 0) list.innerHTML = `<small class="text-body-secondary">（暂无用户）</small>`;
	for (const u of users) {
		const row = document.createElement("div");
		row.className = "d-flex align-items-center gap-2 border-top pt-1";
		row.innerHTML = `<span class="font-monospace small text-truncate"></span>
			<span class="badge ${u.role === "admin" ? "text-bg-warning" : "text-bg-secondary"}">${u.role === "admin" ? "管理员" : "成员"}</span>
			<button class="btn btn-sm btn-outline-danger ms-auto">移除</button>`;
		row.querySelector("span").textContent = u.id;
		row.querySelector("button").onclick = async () => {
			await api("users", { id: u.id, action: "remove" });
			$("usersBtn").onclick();
		};
		list.appendChild(row);
	}
	modal.show();
	const add = async (role) => {
		const id = $("uId").value.trim();
		if (!id.startsWith("ou_")) { toast("需要 ou_ 开头的 open_id", "danger"); return; }
		await api("users", { id, role }).catch((e) => toast(e.message, "danger"));
		$("usersBtn").onclick();
	};
	$("uAdd").onclick = () => add("member");
	$("uAddAdmin").onclick = () => add("admin");
};

loadConvs();
</script>
</body>
</html>
