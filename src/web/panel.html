<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dwell panel</title>
<style>
:root {
	--bg: #16181D; --panel: #1C1F26; --fg: #C9CFD8; --dim: #848C99;
	--line: #2A2E37; --sel: #23262E; --amber: #E2A33B; --amber-dim: rgba(226,163,59,.14);
	--red: #D06A5E; --red-dim: rgba(208,106,94,.12);
	--serif: "Songti SC", "Noto Serif CJK SC", "STSong", SimSun, serif;
	--mono: "Cascadia Code", ui-monospace, Consolas, monospace;
	--sans: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
}
:root[data-theme="light"] {
	--bg: #ECEBE7; --panel: #F3F2EE; --fg: #26262B; --dim: #6B6870;
	--line: #D8D6CF; --sel: #E2E0DA; --amber: #8A5F12; --amber-dim: rgba(181,127,31,.14);
	--red: #B04A3F; --red-dim: rgba(176,74,63,.10);
}
* { box-sizing: border-box; }
html { scrollbar-color: var(--line) transparent; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
html, body { height: 100%; margin: 0; }
body {
	background: var(--bg); color: var(--fg);
	font: 14px/1.7 var(--sans);
	display: flex;
}
#side {
	width: 248px; flex: none; display: flex; flex-direction: column;
	border-right: 1px solid var(--line); min-height: 0; background: var(--panel);
}
#side .brand {
	padding: 14px 16px 12px; border-bottom: 1px solid var(--line);
	display: flex; align-items: baseline; gap: 8px;
}
#side .brand .name { font: 600 15px var(--mono); letter-spacing: 1px; }
#side .brand .cursor {
	width: 8px; height: 15px; background: var(--amber);
	animation: blink 1.3s steps(1) infinite; align-self: center;
}
@keyframes blink { 50% { opacity: 0; } }
#status { font: 12px var(--mono); color: var(--dim); margin-left: auto; }
#status.on { color: var(--fg); }
#convlist { flex: 1; overflow-y: auto; padding: 4px 0; min-height: 0; }
.conv { padding: 8px 16px; cursor: pointer; border-left: 2px solid transparent; }
.conv:hover { background: var(--bg); }
.conv.active { border-left-color: var(--amber); }
.conv .name {
	font-family: var(--serif); font-size: 14px;
	white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.conv.active .name { color: var(--fg); }
.conv .sub { font: 11px var(--mono); color: var(--dim); margin-top: 1px; }
.conv .badge { font-size: 10px; color: var(--dim); border: 1px solid var(--line); padding: 0 4px; border-radius: 3px; margin-left: 4px; }
.conv .run { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex: none; display: none; }
.conv.archived { opacity: .4; }
.sidebtn {
	padding: 9px 16px; border-top: 1px solid var(--line); cursor: pointer; color: var(--dim);
	font: 12.5px var(--mono); background: none; border-left: none; border-right: none; border-bottom: none; text-align: left;
	border-radius: 0;
}
.sidebtn:hover { color: var(--fg); background: var(--bg); }
#approvals { border-top: 1px solid var(--line); max-height: 34%; overflow-y: auto; display: none; }
#approvals.on { display: block; }
#approvals .cap { padding: 10px 16px 4px; font: 600 12px var(--mono); color: var(--amber); }
.appr { padding: 6px 16px 10px 14px; border-left: 3px solid var(--amber); margin: 6px 0 6px 16px; }
.appr .cmd { font: 11.5px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appr .match { color: var(--fg); background: var(--amber-dim); padding: 0 3px; }
.appr .ops { margin-top: 6px; display: flex; gap: 6px; }
.appr button { font: 12px var(--mono); padding: 2px 10px; border-radius: 3px; }
.appr button[data-a="deny"] { color: var(--red); border-color: var(--red); }
#mainArea { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#topbar {
	display: flex; align-items: center; gap: 10px;
	padding: 8px 22px; border-bottom: 1px solid var(--line); flex: none; min-height: 48px;
}
#topbar .title { font-family: var(--serif); font-weight: 600; font-size: 16px; }
#topbar .spacer { flex: 1; }
#topbar button { font: 12.5px var(--mono); padding: 3px 10px; }
select, button {
	background: var(--panel); color: var(--fg); border: 1px solid var(--line);
	border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer;
}
button:disabled { opacity: .4; cursor: default; }
main { flex: 1; overflow-y: auto; padding: 20px 24px 32px; }
main:has(.empty) { display: flex; }
main .empty { margin: auto; color: var(--dim); font-family: var(--serif); }
.msg { display: grid; grid-template-columns: 76px 1fr; gap: 16px; padding: 8px 0; }
.msg + .msg { border-top: 1px solid var(--line); }
.msg .who {
	font: 600 11.5px/1.5 var(--mono); text-align: right; user-select: none;
	color: var(--dim);
}
.msg .when { display: block; font: 10px/1.5 var(--mono); font-weight: 400; color: var(--dim); opacity: .75; }
.msg.user .who { color: var(--amber); }
.msg.dwell .who { color: var(--fg); }
.msg .body { white-space: pre-wrap; word-break: break-word; min-width: 0; font-family: var(--serif); font-size: 14.5px; }
.msg.tool .body { font: 12.5px/1.65 var(--mono); color: var(--fg); opacity: .8; }
.msg.tool.err .body { color: var(--red); }
.msg .meta { font: 11px var(--mono); color: var(--dim); margin-top: 2px; grid-column: 2; }
.msg.user .body { border-left: 2px solid var(--amber); padding-left: 12px; }
.msg.dwell .body { max-width: 84ch; }
.msg.tool .who { color: var(--dim); }
.msg.tool-call .body { color: var(--dim); }
.msg.tool.result .who { color: var(--dim); }
.msg.tool-call + .msg.tool { border-top: 0; }
#live {
	display: none; padding: 8px 24px; border-top: 1px solid var(--line);
	color: var(--dim); font: 12.5px var(--mono); flex: none;
}
#live.on { display: block; color: var(--amber); }
#live .spin { display: inline-block; width: 9px; height: 9px; border: 2px solid var(--amber);
	border-top-color: transparent; border-radius: 50%; margin-right: 8px;
	animation: r 0.9s linear infinite; vertical-align: -1px; }
@keyframes r { to { transform: rotate(360deg); } }
#errline { display: none; padding: 0 24px 8px; color: var(--red); font: 12px var(--mono); flex: none; }
footer { display: flex; gap: 10px; padding: 12px 24px; border-top: 1px solid var(--line); flex: none; }
#input {
	flex: 1; background: var(--panel); color: var(--fg);
	border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px;
	font: 14px/1.6 var(--serif); resize: none; min-height: 42px; max-height: 160px;
}
#input:focus { outline: 1px solid var(--amber); }
#send { font: 13px var(--mono); padding: 0 20px; }
#overlay {
	display: none; position: fixed; inset: 0; background: rgba(10,11,14,.55); z-index: 10;
	align-items: center; justify-content: center;
}
#overlay.on { display: flex; }
#sheet {
	background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
	width: min(480px, 92vw); max-height: 80vh; overflow-y: auto; padding: 20px 22px;
}
#sheet h3 { margin: 0 0 12px; font: 600 14px var(--serif); }
#sheet .row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
#sheet input[type=text] {
	flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
	border-radius: 4px; padding: 6px 10px; font: 13.5px var(--sans);
}
#sheet .ulist .u { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font: 13px var(--mono); align-items: center; }
#sheet .ulist .u .role { color: var(--dim); font-size: 12px; }
#sheet .ulist .u button { margin-left: auto; font-size: 12px; }
@media (max-width: 720px) { #side { display: none; } }
@media (prefers-reduced-motion: reduce) {
	#side .brand .cursor, #live .spin { animation: none; }
}
</style>
</head>
<body>
<aside id="side">
	<div class="brand"><span class="cursor"></span><span class="name">dwell</span><span id="status">…</span></div>
	<div id="convlist"></div>
	<div id="approvals"><div class="cap">需要你的审批</div><div id="apprList"></div></div>
	<button class="sidebtn" id="newConv">＋ 新会话线</button>
	<button class="sidebtn" id="usersBtn">用户管理</button>
	<button class="sidebtn" id="theme">◐ 浅色</button>
</aside>
<div id="mainArea">
	<div id="topbar">
		<span class="title" id="convTitle">—</span>
		<span class="spacer"></span>
		<button id="renameBtn" title="重命名">重命名</button>
		<button id="resetBtn" title="清空上下文开始新对话">清空上下文</button>
		<button id="abortBtn" title="中止当前任务">中止</button>
		<button id="archiveBtn">归档</button>
	</div>
	<main id="main"><div class="empty">选择左侧会话线</div></main>
	<div id="live"><span class="spin"></span><span id="liveText">运行中</span></div>
	<div id="errline"></div>
	<footer>
		<textarea id="input" placeholder="输入消息，Enter 发送 / Shift+Enter 换行" rows="1"></textarea>
		<button id="send">发送</button>
	</footer>
</div>
<div id="overlay"><div id="sheet"></div></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const token = params.get("token") ?? "";
const HEAD = { "x-panel-token": token, "content-type": "application/json" };
const api = async (path, body) => {
	const res = await fetch(`/api/${path}${path.includes("?") ? "&" : "?"}token=${encodeURIComponent(token)}`, body === undefined ? {} : { method: "POST", headers: HEAD, body: JSON.stringify(body) });
	if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
	return res.json();
};
let convs = [], convId = null, es = null, rendered = new Set(), sending = false, showArchived = false;

/* 主题 */
const applyTheme = (t) => {
	document.documentElement.dataset.theme = t;
	$("theme").textContent = t === "dark" ? "light 亮" : "dark 暗";
	localStorage.setItem("dwell-theme", t);
};
applyTheme(params.get("theme") ?? localStorage.getItem("dwell-theme") ?? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
$("theme").onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

/* 会话列表 */
async function loadConvs(keep) {
	convs = await api("conversations");
	const box = $("convlist");
	box.innerHTML = "";
	const visible = convs.filter((c) => showArchived || !c.archived);
	for (const c of visible) {
		const el = document.createElement("div");
		el.className = "conv" + (String(c.id) === String(convId) ? " active" : "") + (c.archived ? " archived" : "");
		const label = c.name !== c.key ? c.name : c.key.replace(/^oc_/, "").slice(0, 20) + "…";
		const typeZh = { direct: "私聊", group: "群", thread: "话题", panel: "panel" }[c.type] ?? c.type;
		el.innerHTML = `<span class="run" style="display:none"></span><div class="t"><div class="name"></div><div class="sub">${typeZh} #${c.id}${c.archived ? " 已归档" : ""}</div></div>`;
		el.querySelector(".name").textContent = label;
		el.title = c.key;
		el.onclick = () => switchConv(c.id);
		box.appendChild(el);
	}
	const arch = document.createElement("button");
	arch.className = "sidebtn";
	arch.textContent = showArchived ? "▸ 隐藏归档" : "▸ 显示归档";
	arch.onclick = () => { showArchived = !showArchived; loadConvs(true); };
	box.appendChild(arch);
	if (!keep && visible.length > 0) {
		const saved = localStorage.getItem("dwell-conv");
		const hit = visible.find((c) => String(c.id) === saved);
		switchConv(hit ? hit.id : visible[visible.length - 1].id);
	}
}
function switchConv(id) {
	convId = id;
	localStorage.setItem("dwell-conv", String(id));
	if (es) es.close();
	rendered = new Set();
	$("main").innerHTML = "";
	const c = convs.find((x) => String(x.id) === String(id));
	$("convTitle").textContent = c ? (c.name !== c.key ? c.name : `#${c.id}`) : `#${id}`;
	$("archiveBtn").textContent = c?.archived ? "取消归档" : "归档";
	loadConvs(true);
	es = new EventSource(`/api/events?conv=${id}&token=${encodeURIComponent(token)}`);
	es.addEventListener("sync", onSync);
	es.onerror = () => { $("status").textContent = "重连中"; $("status").classList.remove("on"); };
}

function onSync(e) {
	$("status").textContent = "已连接"; $("status").classList.add("on");
	render(JSON.parse(e.data));
}

function render(data) {
	const main = $("main");
	const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 48;
	const empty = main.querySelector(".empty"); if (empty) empty.remove();
	for (const entry of data.entries ?? []) {
		if (rendered.has(entry.id)) continue;
		rendered.add(entry.id);
		const node = renderEntry(entry);
		if (node) main.appendChild(node);
	}
	const live = data.live ?? {};
	const running = live.run !== undefined;
	$("live").classList.toggle("on", running);
	$("abortBtn").disabled = !running;
	if (live.run !== undefined) {
		const tools = (live.tools ?? []).map((t) => `${t.name}:${t.status}`);
		$("liveText").textContent = tools.length > 0 ? `运行中 · ${tools.join(" ")}` : "运行中";
	}
	if (nearBottom) main.scrollTop = main.scrollHeight;
}

function renderEntry(entry) {
	const msg = (cls, who, body, meta, at) => {
		const el = document.createElement("div");
		el.className = `msg ${cls}`;
		el.innerHTML = `<span class="who"></span><div class="body"></div>`;
		const whoEl = el.querySelector(".who");
		whoEl.textContent = who;
		if (at !== undefined) {
			const w = document.createElement("span");
			w.className = "when";
			w.textContent = new Date(at).toTimeString().slice(0, 5);
			whoEl.appendChild(w);
		}
		el.querySelector(".body").textContent = body;
		if (meta) {
			const m = document.createElement("div"); m.className = "meta"; m.textContent = meta;
			el.appendChild(m);
		}
		return el;
	};
	const model = entry.model?.[0];
	if (entry.kind === "pi.user") {
		const name = entry.data?.senderName || entry.data?.sender || "";
		return msg("user", name ? String(name).slice(0, 8) : "user", contentText(model?.content), null, entry.model?.[0]?.timestamp);
	}
	if (entry.kind === "pi.assistant") {
		const parts = model?.content ?? [];
		const text = parts.filter((c) => c.type === "text").map((c) => c.text).join("");
		if (text) {
			const el = msg("dwell", "dwell", "", null, entry.model?.[0]?.timestamp);
			const body = el.querySelector(".body");
			body.style.whiteSpace = "pre-line";
			body.innerHTML = mdRender(text);
			return el;
		}
		const calls = parts.filter((c) => c.type === "toolCall");
		if (calls.length > 0) {
			const el = document.createElement("div");
			el.className = "msg tool tool-call";
			el.innerHTML = `<span class="who">tool</span><div class="body"></div>`;
			el.querySelector(".body").textContent = calls.map((c) => `${c.name} · ${summaryArgs(c.arguments)}`).join("\n");
			return el;
		}
		return null;
	}
	if (entry.kind === "pi.tool-result") {
		const err = (entry.data?.diagnostics ?? []).length > 0;
		const raw = contentText(model?.content);
		let body = raw.length > 400 ? raw.slice(0, 400).replace(/\n[^\n]*$/, "") + "\n…（已截断，共 " + raw.length + " 字符）" : raw;
		if (body === "") body = err ? "（错误，无输出）" : "";
		return msg(err ? "tool err" : "tool result", "↳", body, entry.model?.[0]?.toolName ?? "", entry.model?.[0]?.timestamp);
	}
	if (entry.kind === "panel.message" || entry.kind === "chat.message") {
		return msg("user", "user", contentText(model?.content), null);
	}
	return null;
}
function contentText(content) {
	return (content ?? []).flatMap((c) => (c.type === "text" ? [c.text] : [])).join("");
}
function summaryArgs(a) {
	const s = a?.command ?? a?.path ?? JSON.stringify(a) ?? "";
	const t = String(s).replace(/\s+/g, " ");
	return t.length > 72 ? t.slice(0, 72) + "…" : t;
}
function mdRender(text) {
	const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	return esc
		.replace(/```([\s\S]*?)```/g, function (_, c) {
			return '<span style="font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;display:block;padding:6px 10px;background:var(--sel);border-radius:4px">' + c.replace(/^\n/, "") + "</span>";
		})
		.replace(/`([^`\n]+)`/g, '<span style="font-family:var(--mono);font-size:12.5px;background:var(--sel);padding:1px 4px;border-radius:3px">$1</span>')
		.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}

/* 发送 */
async function send() {
	const text = $("input").value.trim();
	if (!text || sending || convId === null) return;
	sending = true; $("send").disabled = true;
	try {
		await api("send", { conv: Number(convId), content: text });
		$("input").value = ""; $("input").style.height = "";
	} catch (err) { flashErr("发送失败: " + err.message); }
	sending = false; $("send").disabled = false; $("input").focus();
}
$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
	if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", function () {
	this.style.height = ""; this.style.height = Math.min(this.scrollHeight, 160) + "px";
});
function flashErr(text) {
	$("errline").textContent = text;
	$("errline").style.display = "block";
	setTimeout(() => { $("errline").style.display = "none"; }, 3000);
}

/* 顶栏操作 */
const confirmAct = async (label, path, body) => {
	if (!confirm(label)) return;
	try { await api(path, body ?? { conv: Number(convId) }); flashErr(""); loadConvs(true); }
	catch (err) { flashErr(err.message); }
};
$("resetBtn").onclick = () => confirmAct("清空当前会话上下文？", "reset");
$("abortBtn").onclick = () => confirmAct("中止当前任务？", "abort");
const curConv = () => convs.find((x) => String(x.id) === String(convId));
$("archiveBtn").onclick = () => {
	const c = curConv();
	if (c === undefined) return;
	if (c.archived) {
		api("archive", { id: Number(convId), archived: false }).then(() => loadConvs(true)).catch((e) => flashErr(e.message));
	} else {
		confirmAct("归档该会话线？（顶栏可随时取消归档）", "archive", { id: Number(convId), archived: true });
	}
};
const sheetInput = (title, initial, onOk) => {
	const sheet = $("sheet");
	sheet.innerHTML = `<h3>${title}</h3><div class="row"><input type="text" id="sheetIn" value="${initial ?? ""}"><button id="sheetOk">确定</button></div><div class="row"><button id="sheetNo">取消</button></div>`;
	$("overlay").classList.add("on");
	const input = sheet.querySelector("#sheetIn");
	input.focus(); input.select();
	const close = () => $("overlay").classList.remove("on");
	sheet.querySelector("#sheetNo").onclick = close;
	sheet.querySelector("#sheetOk").onclick = () => { const v = input.value.trim(); if (v !== "") { close(); onOk(v); } };
	input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) sheet.querySelector("#sheetOk").click(); });
};
$("renameBtn").onclick = () => sheetInput("重命名会话线", $("convTitle").textContent, async (name) => {
	await api("rename", { id: Number(convId), name }).catch((e) => flashErr(e.message));
	loadConvs(true);
});
$("newConv").onclick = () => sheetInput("新建会话线", "", async (name) => {
	const r = await api("conversations", { name }).catch((e) => (flashErr(e.message), null));
	if (r) { await loadConvs(); switchConv(r.id); }
});

/* 审批队列 */
async function loadApprovals() {
	try {
		const list = await api("approvals");
		$("approvals").classList.toggle("on", list.length > 0);
		const box = $("apprList");
		box.innerHTML = "";
		for (const a of list) {
			const el = document.createElement("div");
			el.className = "appr";
			el.innerHTML = `<div class="cmd"></div><div class="ops">
				<button data-a="approve10">批准10分</button><button data-a="approve30">批准30分</button><button data-a="deny">拒绝</button></div>`;
			el.querySelector(".cmd").textContent = `${a.match} · ${a.command.slice(0, 60)}`;
			for (const b of el.querySelectorAll("button")) {
				b.onclick = async () => {
					const action = b.dataset.a === "deny" ? "deny" : "approve";
					const minutes = b.dataset.a === "approve30" ? 30 : 10;
					const r = await api("approve", { key: a.key, action, minutes }).catch((e) => ({ ok: false, error: e.message }));
					if (!r.ok) flashErr(r.error ?? "操作失败");
					loadApprovals();
				};
			}
			box.appendChild(el);
		}
	} catch { /* 忽略轮询失败 */ }
}
setInterval(loadApprovals, 5000);
loadApprovals();

/* 用户管理 */
$("usersBtn").onclick = async () => {
	const users = await api("users").catch(() => []);
	const sheet = $("sheet");
	sheet.innerHTML = `<h3>用户管理</h3>
		<div class="row"><input type="text" id="uId" placeholder="open_id（ou_ 开头）">
		<button id="uAdd">添加成员</button><button id="uAddAdmin">添加管理员</button></div>
		<div class="ulist">${users.map((u) => `<div class="u"><span></span><span class="role">${u.role}</span><button data-id="${u.id}">移除</button></div>`).join("") || '<div class="u"><span class="role">（空）</span></div>'}</div>
		<div class="row"><button id="uClose">关闭</button></div>`;
	sheet.querySelectorAll(".u span:first-child").forEach((s, i) => { s.textContent = users[i].id; });
	$("overlay").classList.add("on");
	$("uClose").onclick = () => $("overlay").classList.remove("on");
	const add = async (role) => {
		const id = $("uId").value.trim();
		if (!id.startsWith("ou_")) { flashErr("需要 ou_ 开头的 open_id"); return; }
		await api("users", { id, role }).catch((e) => flashErr(e.message));
		$("usersBtn").onclick();
	};
	$("uAdd").onclick = () => add("member");
	$("uAddAdmin").onclick = () => add("admin");
	sheet.querySelectorAll(".ulist button[data-id]").forEach((b) => {
		b.onclick = async () => { await api("users", { id: b.dataset.id, action: "remove" }); $("usersBtn").onclick(); };
	});
};
$("overlay").onclick = (e) => { if (e.target.id === "overlay") $("overlay").classList.remove("on"); };

loadConvs();
</script>
</body>
</html>
