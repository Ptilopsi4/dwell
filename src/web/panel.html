<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dwell panel</title>
<link href="/vendor/basecoat.cdn.min.css" rel="stylesheet">
<style>
/* 视觉：Linear/Raycast 式工具台。覆盖 Basecoat 语义 token（:root.dark 特异性高于 Basecoat 的 .dark），
   组件类名避开 Basecoat 的 .drawer/.item/.label/.card/.sidebar 等 */
:root {
	--background: #fbfbfc; --foreground: #1c1d21; --card: #ffffff; --card-foreground: #1c1d21;
	--popover: #ffffff; --popover-foreground: #1c1d21;
	--primary: #5e5ce6; --primary-foreground: #ffffff;
	--secondary: #f0f1f4; --secondary-foreground: #3b3d45;
	--muted: #f3f4f6; --muted-foreground: #6c707a;
	--accent: #eceef2; --accent-foreground: #1c1d21;
	--destructive: #d93f4c; --border: #e5e6ea; --input: #e1e3e8; --ring: #5e5ce6;
	--side: #f5f6f8; --raised: #ffffff; --hover: rgb(0 0 0 / .045); --sel: rgb(0 0 0 / .07);
	--ok: #1f9d63; --warn: #c27c0e; --faint: #9a9ea8;
	--shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 16px rgb(0 0 0 / .06);
	--radius: .5rem;
}
:root.dark {
	--background: #101114; --foreground: #e3e4e8; --card: #16171b; --card-foreground: #e3e4e8;
	--popover: #1b1c21; --popover-foreground: #e3e4e8;
	--primary: #7b79f2; --primary-foreground: #ffffff;
	--secondary: #23242a; --secondary-foreground: #c9cad1;
	--muted: #1c1d22; --muted-foreground: #8b8e98;
	--accent: #222329; --accent-foreground: #e3e4e8;
	--destructive: #f06b74; --border: #24252b; --input: #2c2d34; --ring: #7b79f2;
	--side: #0c0d10; --raised: #17181c; --hover: rgb(255 255 255 / .04); --sel: rgb(255 255 255 / .07);
	--ok: #4cc38a; --warn: #e2a93b; --faint: #5f626b;
	--shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
}
html, body { height: 100%; }
body {
	display: flex; overflow: hidden; background: var(--background); color: var(--foreground);
	/* 拉丁优先各平台 UI 字体，中文接 PingFang / 雅黑 UI / Noto；system-ui 放后，避免中文 Windows 上拉丁也落到雅黑 */
	font: 13.5px/1.6 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
	-webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-feature-settings: "cv11", "ss01";
	/* 等宽体里的中文显式回落到无衬线体，否则 Windows 会用宋体 */
	--mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", "PingFang SC", "Microsoft YaHei UI", "Noto Sans Mono CJK SC", monospace;
	--fs-read: 14.5px; --fs-meta: 11.5px; --indent: 31px; --col: 800px;
}
* { scrollbar-width: thin; scrollbar-color: var(--input) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--input); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::selection { background: color-mix(in srgb, var(--primary) 30%, transparent); }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--primary) 60%, transparent); outline-offset: 1px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
.mono { font-family: var(--mono); }
.btn { font-weight: 500; }
.btn[data-variant="ghost"] { color: var(--muted-foreground); }
.btn[data-variant="ghost"]:hover { color: var(--foreground); background: var(--hover); }
.kbd { font: 10.5px var(--mono); color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; line-height: 16px; background: var(--background); }

/* ── 侧栏 ── */
#side { width: 260px; flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--border); }
.side-head { display: flex; align-items: center; gap: .55rem; height: 52px; padding: 0 .9rem; }
.logo { width: 22px; height: 22px; border-radius: 6px; flex: none; display: grid; place-items: center; color: #fff; font: 700 12px/1 system-ui; background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 55%, #22d3ee)); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .15); }
.side-head b { font-weight: 600; font-size: 14px; }
.side-head .conn { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted-foreground); }
.side-head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
.side-head .dot.off { background: var(--destructive); box-shadow: 0 0 0 3px color-mix(in srgb, var(--destructive) 18%, transparent); }
.side-search { position: relative; padding: 0 .65rem .55rem; }
.side-search svg { position: absolute; left: 1.25rem; top: 50%; transform: translateY(-62%); color: var(--faint); pointer-events: none; }
.side-search input { width: 100%; height: 30px; padding: 0 3rem 0 1.95rem; font-size: 13px; border-radius: 7px; border: 1px solid var(--border); background: var(--background); color: inherit; box-shadow: none; }
.side-search input::placeholder { color: var(--faint); }
.side-search input:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); outline: none; }
.side-search .kbd { position: absolute; right: 1.15rem; top: 50%; transform: translateY(-62%); pointer-events: none; }
.side-sec { padding: .5rem 1.05rem .25rem; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--faint); text-transform: uppercase; }
#convlist { flex: 1; overflow-y: auto; padding: 0 .45rem .5rem; min-height: 0; }
.conv { display: flex; align-items: center; gap: .55rem; width: 100%; height: 32px; text-align: left; padding: 0 .6rem; border-radius: 6px; cursor: pointer; border: 0; background: none; color: var(--secondary-foreground); font: inherit; font-size: 13px; }
.conv svg { color: var(--faint); }
.conv:hover { background: var(--hover); color: var(--foreground); }
.conv.sel { background: var(--sel); color: var(--foreground); }
.conv.sel svg { color: var(--primary); }
.conv .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv .tm { font-size: 11px; color: var(--faint); white-space: nowrap; }
.conv .pend { font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); line-height: 17px; white-space: nowrap; }
.conv.arch { opacity: .55; }
.side-link { display: block; width: 100%; text-align: left; padding: .3rem .6rem; margin-top: .25rem; font-size: 12px; color: var(--faint); background: none; border: 0; cursor: pointer; border-radius: 6px; }
.arch-head { display: flex; align-items: center; gap: 5px; width: 100%; margin-top: .7rem; padding: .3rem .6rem; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; }
.arch-head:hover { color: var(--muted-foreground); background: var(--hover); }
.arch-head svg { transition: transform .12s; }
.arch-head.open svg { transform: rotate(90deg); }
.arch-head .cnt { margin-left: auto; font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.side-link:hover { color: var(--foreground); background: var(--hover); }
.side-empty { padding: 1.5rem .5rem; text-align: center; font-size: 12.5px; color: var(--muted-foreground); }
#approvals { max-height: 38%; overflow-y: auto; padding: 0 .65rem .6rem; }
.appr { padding: .55rem .65rem; margin-bottom: .45rem; border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--border)); border-radius: 8px; background: var(--raised); }
.appr .where { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
.appr .where .nm { color: var(--foreground); font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appr pre { margin: .35rem 0 .5rem; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; max-height: 4.6em; overflow: hidden; color: var(--secondary-foreground); }
.ops { display: flex; flex-wrap: wrap; gap: .35rem; }
.side-foot { display: flex; gap: .3rem; padding: .55rem .6rem; border-top: 1px solid var(--border); }
.side-foot .grow { flex: 1; justify-content: flex-start; color: var(--secondary-foreground); }

/* ── 主区：顶栏与内容共用同一列宽，标题/元信息与正文对齐 ── */
#mainArea { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.col { max-width: var(--col); width: 100%; margin: 0 auto; padding: 0 2rem; }
#topbar { flex: none; height: 52px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--background) 85%, transparent); backdrop-filter: blur(8px); }
#topbar .col { height: 100%; display: flex; align-items: center; gap: .55rem; }
#topbar .title { font-weight: 600; font-size: 14px; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#convType { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 5px; background: var(--secondary); color: var(--muted-foreground); white-space: nowrap; }
#topbar .spacer { flex: 1; }
#metaChip { display: inline-flex; align-items: center; gap: .45rem; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
#metaChip .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
#metaChip .model { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); font: 11.5px var(--mono); color: var(--secondary-foreground); }
#metaChip .model::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 180px; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: 9px; padding: 4px; box-shadow: var(--shadow); }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; border-radius: 6px; padding: 6px 10px; background: none; border: none; color: inherit; font: 13px/1.4 inherit; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--hover); }
.menu button.danger { color: var(--destructive); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 2px; }
.confirm-inline { color: var(--destructive) !important; font-weight: 600; }

main { flex: 1; overflow-y: auto; }
#log { padding-top: 1.5rem; padding-bottom: 2.5rem; }
.empty { color: var(--muted-foreground); text-align: center; padding: 5rem 1rem; font-size: 13px; }
.empty .logo { width: 36px; height: 36px; border-radius: 10px; font-size: 18px; margin: 0 auto .9rem; }
.empty b { display: block; color: var(--foreground); font-size: 15px; font-weight: 600; margin-bottom: .25rem; }
.day { display: flex; align-items: center; gap: .75rem; margin: 1.5rem 0 .5rem; font-size: 11.5px; font-weight: 500; color: var(--faint); }
.day::before, .day::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
.note { margin: .7rem 0 .7rem var(--indent); font-size: 12px; color: var(--muted-foreground); white-space: pre-wrap; display: flex; gap: .5rem; }
.note::before { content: ""; flex: none; width: 2px; border-radius: 2px; background: var(--border); }

/* 消息：头像 + 名字一行，正文缩进对齐名字；同一轮后续块（工具组、续写）沿用缩进。
   节奏：轮与轮之间 1.6rem，轮内块之间 .5rem */
.m { position: relative; margin: 1.6rem 0 .3rem; padding-left: var(--indent); }
#log > .m:first-child, #log > .day + .m { margin-top: .4rem; }
.m .hd { display: flex; align-items: center; gap: 9px; height: 22px; margin: 0 0 .3rem calc(-1 * var(--indent)); font-size: 13px; }
.av { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 600 11px/1 system-ui, sans-serif; color: #fff; background: color-mix(in srgb, var(--primary) 70%, #64748b); }
.m.bot .av { border-radius: 6px; background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 55%, #22d3ee)); }
.m .hd .who { font-weight: 600; color: var(--foreground); }
.m .hd time { font-size: var(--fs-meta); color: var(--faint); font-variant-numeric: tabular-nums; }
.m.user .bd { white-space: pre-wrap; word-break: break-word; color: var(--foreground); font-size: var(--fs-read); line-height: 1.75; }
.m.bot .bd { word-break: break-word; color: color-mix(in srgb, var(--foreground) 90%, var(--muted-foreground)); font-size: var(--fs-read); }
.m.cont { margin-top: .5rem; }
.m.streaming .bd > :last-child::after { content: ""; display: inline-block; width: 6px; height: 14px; vertical-align: -2px; margin-left: 3px; border-radius: 1px; background: var(--primary); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.m .acts { position: absolute; top: -2px; right: 0; display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.m:hover .acts, .m:focus-within .acts { opacity: 1; }
@media (hover: none) { .m .acts { opacity: .6; } }
.m.err { padding-left: var(--indent); }
.m.err .bd { display: flex; gap: .5rem; align-items: flex-start; color: var(--destructive); font-size: 13px; padding: .45rem .7rem; border-radius: 8px; background: color-mix(in srgb, var(--destructive) 8%, transparent); white-space: pre-wrap; }
details.think { margin: 0 0 .4rem; font-size: 12.5px; color: var(--muted-foreground); }
details.think summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 4px; user-select: none; color: var(--faint); }
details.think summary:hover { color: var(--muted-foreground); }
details.think summary::-webkit-details-marker { display: none; }
details.think summary svg { transition: transform .12s; }
details.think[open] summary svg { transform: rotate(90deg); }
details.think .tx { white-space: pre-wrap; border-left: 2px solid var(--border); padding: .15rem 0 .15rem .75rem; margin-top: .3rem; max-height: 320px; overflow: auto; }

/* 工具调用：任务列表式 */
.tools { margin: .55rem 0 .55rem var(--indent); border: 1px solid var(--border); border-radius: 8px; background: var(--raised); overflow: hidden; }
.tools-sum { display: flex; align-items: center; gap: 7px; width: 100%; height: 30px; padding: 0 .75rem; font-size: 12px; color: var(--muted-foreground); background: none; border: 0; border-bottom: 1px solid var(--border); cursor: pointer; text-align: left; }
.tools-sum:hover { color: var(--foreground); background: var(--hover); }
.tools-sum .mono { color: var(--faint); font-size: 11.5px; }
.tools-sum svg { transition: transform .12s; }
.tools:not(.fold) .tools-sum svg { transform: rotate(90deg); }
.tools.fold.many details.tc:not(:last-child) { display: none; }
details.tc + details.tc { border-top: 1px solid var(--border); }
details.tc summary { display: flex; align-items: center; gap: .6rem; height: 32px; padding: 0 .75rem; cursor: pointer; list-style: none; font-size: 12.5px; min-width: 0; }
details.tc summary::-webkit-details-marker { display: none; }
details.tc summary:hover { background: var(--hover); }
details.tc[open] summary { background: var(--hover); }
.tc .st { width: 14px; display: inline-flex; justify-content: center; color: var(--faint); }
.tc .st.ok { color: var(--ok); }
.tc .st.bad { color: var(--destructive); }
.tc .tn { font: 500 12px var(--mono); color: var(--foreground); }
.tc .ta { flex: 1; min-width: 0; font: 12px var(--mono); color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tc .tm { font-size: 11px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tc .tb { padding: .2rem .7rem .7rem 2.15rem; border-top: 1px solid var(--border); background: var(--background); }
.tc .tb .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin: .55rem 0 .25rem; }
.tc pre { margin: 0; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; padding: .5rem .65rem; background: var(--raised); border: 1px solid var(--border); border-radius: 6px; color: var(--secondary-foreground); }
.tc.bad pre.out { color: var(--destructive); }
.spin { width: 12px; height: 12px; border: 1.8px solid color-mix(in srgb, var(--primary) 30%, transparent); border-top-color: var(--primary); border-radius: 50%; animation: r .7s linear infinite; flex: none; }
@keyframes r { to { transform: rotate(360deg); } }
</style>
<style>
/* markdown（Basecoat preflight 清掉了列表/标题样式，这里全部自定义） */
.md { line-height: 1.75; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: .65em 0; }
.md strong { font-weight: 600; color: var(--foreground); }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-weight: 600; line-height: 1.4; margin: 1.3em 0 .5em; color: var(--foreground); letter-spacing: -.005em; }
.md h1 { font-size: 1.24em; } .md h2 { font-size: 1.12em; } .md h3 { font-size: 1.03em; } .md h4, .md h5, .md h6 { font-size: 1em; color: var(--secondary-foreground); }
.md ul, .md ol { margin: .45em 0; padding-left: 1.4em; }
.md ul { list-style: disc; } .md ul ul { list-style: circle; } .md ol { list-style: decimal; }
.md li { margin: .2em 0; padding-left: .15em; } .md li::marker { color: var(--faint); }
.md li > ul, .md li > ol { margin: .15em 0; }
.md blockquote { margin: .6em 0; padding: .1em .9em; border-left: 2px solid color-mix(in srgb, var(--primary) 50%, var(--border)); color: var(--muted-foreground); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
.md a { color: var(--primary); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--primary) 35%, transparent); }
.md a:hover { border-bottom-color: var(--primary); }
.md del { opacity: .65; }
.md code { font: 400 .84em var(--mono); background: var(--secondary); color: var(--secondary-foreground); padding: .14em .4em; border-radius: 4px; }
.md .cb { margin: .65em 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--raised); }
.md .cb .cbh { display: flex; align-items: center; justify-content: space-between; height: 28px; padding: 0 .3rem 0 .75rem; font: 11px var(--mono); color: var(--faint); border-bottom: 1px solid var(--border); }
.md .cb pre { margin: 0; padding: .7rem .85rem; overflow-x: auto; font: 12.5px/1.7 var(--mono); }
.md .cb pre code { background: none; padding: 0; font-size: inherit; color: var(--secondary-foreground); }
.md .tbl { overflow-x: auto; margin: .65em 0; border: 1px solid var(--border); border-radius: 8px; }
.md table { border-collapse: collapse; font-size: 13px; line-height: 1.55; width: 100%; }
.md th, .md td { padding: .45em .8em; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
.md tr:last-child td { border-bottom: 0; }
.md th { background: var(--muted); font-weight: 600; font-size: 12px; color: var(--muted-foreground); }

/* 底部：审批 / 运行条 / 输入 */
#tobottom { position: absolute; left: 50%; transform: translateX(-50%); z-index: 30; display: none; align-items: center; gap: 5px; background: var(--popover); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--secondary-foreground); box-shadow: var(--shadow); }
#tobottom.on { display: inline-flex; }
.dock { flex: none; padding-bottom: 1rem; }
#inlappr { display: none; margin-bottom: .55rem; padding: .7rem .85rem; border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--border)); border-radius: 10px; background: color-mix(in srgb, var(--warn) 6%, var(--raised)); }
#inlappr.on { display: block; }
#inlappr .cap { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
#inlappr .cap svg { color: var(--warn); }
#inlappr .cap small { font-weight: 400; color: var(--muted-foreground); }
#inlappr pre { margin: .45rem 0 .6rem; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-all; max-height: 9.5em; overflow: auto; padding: .45rem .65rem; background: var(--background); border: 1px solid var(--border); border-radius: 6px; }
#runbar { display: none; align-items: center; gap: 8px; height: 28px; margin-bottom: .4rem; padding: 0 .3rem 0 .7rem; font-size: 12.5px; color: var(--muted-foreground); }
#runbar.on { display: flex; }
#runbar .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#runbar .t b { font-weight: 500; color: var(--secondary-foreground); }
#archBanner { display: none; align-items: center; gap: .5rem; margin-bottom: .4rem; padding: 0 .3rem 0 .7rem; font-size: 12.5px; color: var(--muted-foreground); }
#archBanner.on { display: flex; }
#composer { border: 1px solid var(--input); border-radius: 12px; background: var(--raised); padding: .65rem .6rem .5rem .95rem; box-shadow: 0 1px 2px rgb(0 0 0 / .04); transition: border-color .12s, box-shadow .12s; }
#composer:focus-within { border-color: color-mix(in srgb, var(--primary) 55%, var(--input)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent); }
#composer .row { display: flex; align-items: flex-end; gap: .5rem; }

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
// token 首次由 URL 带入，服务端已换发 HttpOnly cookie；从地址栏移除，避免进历史/截图/分享链接
if (params.has("token")) {
	const clean = new URLSearchParams(params);
	clean.delete("token");
	history.replaceState(null, "", location.pathname + (clean.toString() !== "" ? `?${clean}` : ""));
}
const api = async (path, body) => {
	const res = await fetch(`/api/${path}`, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
	if (!res.ok) {
		const text = await res.text();
		let msg = text;
		try { msg = JSON.parse(text).error ?? text; } catch { /* 非 JSON 原样显示 */ }
		throw new Error(`${res.status} ${msg}`);
	}
	return res.json();
};

/* ── 图标（lucide 路径） ── */
const ICONS = {
	menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
	more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
	users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
	sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-2.93 1.41-1.41m11.32-11.32 1.41-1.41M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41"/>',
	moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
	plus: '<path d="M5 12h14M12 5v14"/>',
	check: '<path d="M20 6 9 17l-5-5"/>',
	x: '<path d="M18 6 6 18M6 6l12 12"/>',
	chev: '<path d="m9 18 6-6-6-6"/>',
	copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
	arrowDown: '<path d="M12 5v14m7-7-7 7-7-7"/>',
	send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
	search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
	shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>',
	direct: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
	group: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>',
	thread: '<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',
	panel: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/>',
};
const ic = (name, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] ?? ""}</svg>`;
for (const el of document.querySelectorAll("[data-ic]")) el.outerHTML = ic(el.dataset.ic, el.dataset.cls ?? "");
if (/Mac|iPhone|iPad/.test(navigator.platform)) $("qKbd").textContent = "⌘K";

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const TYPE_ZH = { direct: "私聊", group: "群聊", thread: "话题", panel: "panel" };

/* ── 主题：未手动选择时跟随系统 ── */
const sysTheme = matchMedia("(prefers-color-scheme: light)");
const applyTheme = (t, remember) => {
	document.documentElement.classList.toggle("dark", t === "dark");
	$("theme").innerHTML = ic(t === "dark" ? "sun" : "moon");
	$("theme").title = t === "dark" ? "切换浅色" : "切换深色";
	if (remember) localStorage.setItem("dwell-theme", t);
};
applyTheme(params.get("theme") ?? localStorage.getItem("dwell-theme") ?? (sysTheme.matches ? "light" : "dark"), false);
sysTheme.addEventListener("change", (e) => { if (localStorage.getItem("dwell-theme") === null) applyTheme(e.matches ? "light" : "dark", false); });
$("theme").onclick = () => applyTheme(document.documentElement.classList.contains("dark") ? "light" : "dark", true);

/* ── 通用 ── */
function toast(msg, err) {
	const el = document.createElement("div");
	el.className = "toast-item" + (err ? " err" : "");
	el.textContent = msg;
	$("toasts").appendChild(el);
	setTimeout(() => el.remove(), err ? 4500 : 2600);
}
function relTime(ts) {
	if (!ts) return "";
	const d = Date.now() - ts;
	if (d < 60e3) return "刚刚";
	if (d < 3600e3) return Math.floor(d / 60e3) + " 分钟前";
	if (d < 86400e3) return Math.floor(d / 3600e3) + " 小时前";
	if (d < 7 * 86400e3) return Math.floor(d / 86400e3) + " 天前";
	const t = new Date(ts);
	return `${t.getMonth() + 1}/${t.getDate()}`;
}
const hhmm = (ts) => new Date(ts).toTimeString().slice(0, 5);
const dayKey = (ts) => new Date(ts).toDateString();
function dayLabel(ts) {
	const t = new Date(ts), now = new Date();
	const y = new Date(now); y.setDate(now.getDate() - 1);
	if (t.toDateString() === now.toDateString()) return "今天";
	if (t.toDateString() === y.toDateString()) return "昨天";
	const wd = "日一二三四五六"[t.getDay()];
	return `${t.getFullYear() === now.getFullYear() ? "" : t.getFullYear() + "年"}${t.getMonth() + 1}月${t.getDate()}日 周${wd}`;
}
const fmtTokens = (n) => (n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n));
function copyText(text, btn) {
	navigator.clipboard.writeText(text).then(() => {
		if (!btn) { toast("已复制"); return; }
		const old = btn.innerHTML;
		btn.innerHTML = ic("check", "sm");
		setTimeout(() => (btn.innerHTML = old), 1200);
	}, () => toast("复制失败（需要 HTTPS 或 localhost）", true));
}
/* inline confirm：二次点击确认 */
function armConfirm(btn, fn, prompt = "确认?") {
	if (btn.dataset.armed === "1") { btn.dataset.armed = ""; btn.classList.remove("confirm-inline"); btn.innerHTML = btn.dataset.label; fn(); return; }
	btn.dataset.label = btn.innerHTML;
	btn.dataset.armed = "1"; btn.classList.add("confirm-inline"); btn.textContent = prompt;
	setTimeout(() => { if (btn.dataset.armed === "1") { btn.dataset.armed = ""; btn.classList.remove("confirm-inline"); btn.innerHTML = btn.dataset.label; } }, 2500);
}

/* ── markdown：先切块再逐块转义，链接只放行 http(s)/mailto ── */
function mdInline(src) {
	const codes = [];
	let s = src.replace(/`([^`\n]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
	s = esc(s);
	s = s.replace(/\[([^\]\n]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
	s = s.replace(/(^|[\s(（])((?:https?:\/\/)[^\s<>()（）]+[^\s<>()（）.,;:!?。，；：！？])/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
	s = s.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>").replace(/__([^_\n]+?)__/g, "<strong>$1</strong>");
	s = s.replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\w)/g, "$1<em>$2</em>");
	s = s.replace(/~~([^~\n]+?)~~/g, "<del>$1</del>");
	return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[Number(i)])}</code>`);
}
function mdRender(text) {
	const lines = text.replace(/\r\n?/g, "\n").split("\n");
	const out = [];
	let i = 0;
	const isBreak = (l) => /^\s*(```|~~~)/.test(l) || /^#{1,6}\s/.test(l) || /^\s*>/.test(l) || /^\s*([-*+]|\d+[.)])\s+/.test(l) || /^\s*([-*_])(\s*\1){2,}\s*$/.test(l) || l.trim() === "";
	while (i < lines.length) {
		const l = lines[i];
		const fence = /^\s*(```|~~~)\s*([\w+#.-]*)/.exec(l);
		if (fence) {
			const body = [];
			i++;
			while (i < lines.length && !lines[i].trim().startsWith(fence[1])) body.push(lines[i++]);
			i++; // 闭合围栏；流式生成中未闭合时吃到结尾
			const code = body.join("\n");
			out.push(`<div class="cb"><div class="cbh"><span>${esc(fence[2] || "code")}</span><button class="btn" data-variant="ghost" data-size="icon-xs" data-copy title="复制">${ic("copy", "sm")}</button></div><pre><code>${esc(code)}</code></pre></div>`);
			continue;
		}
		const h = /^(#{1,6})\s+(.*)$/.exec(l);
		if (h) { out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); i++; continue; }
		if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
		if (/^\s*>/.test(l)) {
			const q = [];
			while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*> ?/, ""));
			out.push(`<blockquote>${mdRender(q.join("\n"))}</blockquote>`);
			continue;
		}
		if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
			const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => mdInline(c.trim()));
			const head = cells(l);
			i += 2;
			const rows = [];
			while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]));
			out.push(`<div class="tbl"><table><thead><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
			continue;
		}
		if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
			const items = [];
			while (i < lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length > 0))) {
				const m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]);
				if (m) items.push({ indent: m[1].replace(/\t/g, "  ").length, ordered: /\d/.test(m[2]), start: parseInt(m[2], 10), text: m[3] });
				else items[items.length - 1].text += "\n" + lines[i].trim();
				i++;
			}
			out.push(mdList(items, 0, items.length));
			continue;
		}
		if (l.trim() === "") { i++; continue; }
		const para = [];
		while (i < lines.length && (para.length === 0 || !isBreak(lines[i]))) para.push(lines[i++]);
		out.push(`<p>${para.map(mdInline).join("<br>")}</p>`);
	}
	return out.join("");
}
/** 按缩进把扁平列表项组装成嵌套 ul/ol。 */
function mdList(items, from, to) {
	if (from >= to) return "";
	const base = items[from].indent;
	const ordered = items[from].ordered;
	const startAttr = ordered && items[from].start > 1 ? ` start="${items[from].start}"` : "";
	let html = ordered ? `<ol${startAttr}>` : "<ul>";
	let k = from;
	while (k < to) {
		let j = k + 1;
		while (j < to && items[j].indent > base) j++;
		html += `<li>${items[k].text.split("\n").map(mdInline).join("<br>")}${mdList(items, k + 1, j)}</li>`;
		k = j;
	}
	return html + (ordered ? "</ol>" : "</ul>");
}
document.addEventListener("click", (e) => {
	const b = e.target.closest("[data-copy]");
	if (b) copyText(b.closest(".cb").querySelector("code").textContent, b);
});

/* ── 发送者真名：按 open_id 批量查，查到后回填所有同 id 的标签 ── */
const names = new Map();
let nameQueue = new Set(), nameTimer = 0;
function senderLabel(id, fallback) {
	if (!id) return fallback;
	if (names.has(id)) return names.get(id) ?? fallback;
	nameQueue.add(id);
	clearTimeout(nameTimer);
	nameTimer = setTimeout(flushNames, 50);
	return fallback;
}
async function flushNames() {
	const ids = [...nameQueue].filter((id) => !names.has(id));
	nameQueue = new Set();
	if (ids.length === 0) return;

<script>
"use strict";
/* ── 会话状态 ── */
let convs = [], convId = null, es = null, showArchived = localStorage.getItem("dwell-show-archived") === "1", sending = false, running = false, runSince = 0;
let sendMode = "feishu";
let convSig = "", apprSig = "", pendingByConv = new Map();
// transcript 渲染游标：工具调用行按 callId 索引，结果到达时回填
let T = null;
const freshTranscript = () => ({ ids: new Set(), calls: new Map(), group: null, lastDay: null, lastKind: null, stream: null });

const drawer = (open) => document.body.classList.toggle("side-open", open);
$("drawerBtn").onclick = () => drawer(true);
$("scrim").onclick = () => drawer(false);

function convTitle(c) {
	if (c.title) return c.title;
	if (c.name !== c.key) return c.name;
	const short = (s) => String(s ?? "").replace(/^o[cu]_/, "").slice(0, 8);
	if (c.type === "direct") return `私聊 ${short(c.owner)}`;
	if (c.type === "group") return `群 ${short(c.key)} · ${short(c.owner)}`;
	if (c.type === "thread") return `话题 ${short(c.key)}`;
	return c.name;
}

/* ── 会话列表：结构未变时只刷新时间与角标，不重建 DOM ── */
async function loadConvs(keep) {
	convs = await api("conversations");
	const q = $("q").value.trim().toLowerCase();
	const box = $("convlist");
	const match = (c) => q === "" || convTitle(c).toLowerCase().includes(q) || c.key.toLowerCase().includes(q) || String(c.id) === q;
	const byRecent = (a, b) => (b.lastTs ?? 0) - (a.lastTs ?? 0);
	const active = convs.filter((c) => !c.archived && match(c)).sort(byRecent);
	const archived = convs.filter((c) => c.archived && match(c)).sort(byRecent);
	// 归档区默认折叠；搜索中或当前会话已归档时自动展开，保证命中项/选中项可见
	const openArch = showArchived || q !== "" || archived.some((c) => String(c.id) === String(convId));
	const visible = openArch ? [...active, ...archived] : active;
	const sig = JSON.stringify([openArch, q, active.map((c) => [c.id, convTitle(c), c.type]), archived.map((c) => [c.id, convTitle(c), c.type])]);
	if (sig !== convSig) {
		convSig = sig;
		const scroll = box.scrollTop;
		box.replaceChildren();
		const item = (c) => {
			const el = document.createElement("button");
			el.className = "conv" + (c.archived ? " arch" : "");
			el.dataset.id = String(c.id);
			el.innerHTML = `${ic(c.type in ICONS ? c.type : "panel", "sm")}<span class="nm"></span><span class="pend" hidden></span><span class="tm"></span>`;
			el.title = `${TYPE_ZH[c.type] ?? c.type} · #${c.id}${c.archived ? " · 已归档" : ""}\n${c.key}`;

		};
		for (const c of active) box.appendChild(item(c));
		if (active.length === 0 && !(q !== "" && archived.length > 0)) box.insertAdjacentHTML("beforeend", `<div class="side-empty">${q ? "没有匹配的会话" : "没有进行中的会话"}</div>`);
		if (archived.length > 0) {

			head.onclick = () => {

		const wanted = params.get("conv") ?? localStorage.getItem("dwell-conv");
		const hit = convs.find((c) => String(c.id) === wanted);
		const first = active[0] ?? archived[0];
		if (hit || first) switchConv((hit ?? first).id);

}
function refreshConvMarks(visible = convs) {
	for (const c of visible) {
		const el = $("convlist").querySelector(`.conv[data-id="${c.id}"]`);
		if (!el) continue;
		el.querySelector(".tm").textContent = relTime(c.lastTs);
		const n = pendingByConv.get(Number(c.id)) ?? 0;

		p.textContent = `待审 ${n}`;
	}

}
function markActive() {
	for (const el of $("convlist").querySelectorAll(".conv")) el.classList.toggle("sel", el.dataset.id === String(convId));
	if (convId === null) return;
	const c = convs.find((x) => String(x.id) === String(convId));
	const title = c ? convTitle(c) : `#${convId}`;
	$("convTitle").textContent = title;
	document.title = `${title} · dwell`;
	$("convType").hidden = !c;
	$("convType").textContent = c ? (TYPE_ZH[c.type] ?? c.type) : "";
	$("archiveBtn").textContent = c?.archived ? "取消归档" : "归档";
	$("archBanner").classList.toggle("on", Boolean(c?.archived));

}
$("q").addEventListener("input", () => loadConvs(true).catch(() => {}));

function switchConv(id) {
	const leaving = convs.find((c) => String(c.id) === String(convId));
	convId = id;
	localStorage.setItem("dwell-conv", String(id));
	// 离开/进入归档会话会改变归档区的自动展开状态，立即重算列表
	if (leaving?.archived || convs.find((c) => String(c.id) === String(id))?.archived) loadConvs(true).catch(() => {});
	if (es) es.close();
	T = freshTranscript();
	$("log").replaceChildren();
	$("metaChip").textContent = "";
	setRunning(null);
	markActive();
	for (const el of [$("input"), $("send"), $("menuBtn")]) el.disabled = false;
	apprSig = "";

	es = new EventSource(`/api/events?conv=${encodeURIComponent(id)}`);
	es.addEventListener("sync", (e) => { setStatus(true); render(JSON.parse(e.data)); });

}
function setStatus(on) {
	$("status").textContent = on ? "已连接" : "重连中…";
	$("statusDot").classList.toggle("off", !on);
}

/* ── transcript ── */
function render(data) {
	const main = $("main"), log = $("log");
	const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 80;
	if (data.mode !== "append") { T = freshTranscript(); log.replaceChildren(); }
	log.querySelector(":scope > .empty")?.remove();
	for (const entry of data.entries ?? []) {
		if (T.ids.has(entry.id)) continue;
		T.ids.add(entry.id);
		try { appendEntry(entry); } catch (err) { console.error("render entry", entry.kind, entry.id, err); }
	}
	applyLive(data.live);
	if (data.meta) {
		const m = data.meta;
		const model = m.model ? m.model.split("/").pop() : "";
		const parts = [m.model ? `<span class="model">${esc(model)}</span>` : "", m.tokens > 0 ? `${fmtTokens(m.tokens)} tokens` : "", m.cost > 0 ? `$${m.cost.toFixed(m.cost < 1 ? 3 : 2)}` : ""].filter(Boolean);
		$("metaChip").innerHTML = parts.join('<span class="sep"></span>');
		$("metaChip").title = m.model ?? "";
	}
	if (log.childElementCount === 0) log.innerHTML = `<div class="empty"><div class="logo">d</div><b>开始对话</b>发送第一条消息；运行中发送的消息会插入当前任务</div>`;
	if (nearBottom) main.scrollTop = main.scrollHeight;
}
function dayMark(ts) {
	if (!ts) return;
	const k = dayKey(ts);
	if (k === T.lastDay) return;
	const first = T.lastDay === null;
	T.lastDay = k;
	if (first && k === dayKey(Date.now())) return;
	const d = document.createElement("div");
	d.className = "day";
	d.textContent = dayLabel(ts);
	$("log").appendChild(d);
	T.lastKind = "day";
}
const initial = (name) => (String(name).trim()[0] ?? "?").toUpperCase();
function msgEl(cls, who, ts, sender) {
	const el = document.createElement("div");
	el.className = `m ${cls}`;
	el.innerHTML = `<div class="hd"><span class="av"></span><span class="who"></span><time></time></div><div class="bd"></div>`;
	el.querySelector(".av").textContent = cls.startsWith("bot") ? "d" : initial(who);
	const w = el.querySelector(".who");
	w.textContent = who;
	if (sender) w.dataset.sender = sender;
	if (ts) { const t = el.querySelector("time"); t.textContent = hhmm(ts); t.title = new Date(ts).toLocaleString(); }
	return el;
}
function contentText(content) {
	// user 消息的 content 可以是纯字符串（panel/飞书提交）或 content block 数组
	if (typeof content === "string") return content;
	return (content ?? []).flatMap((c) => (c.type === "text" ? [c.text] : [])).join("");
}
function appendEntry(entry) {

	const ts = model?.timestamp;

		dayMark(ts);

		const el = document.createElement("div");
		el.className = "note";
		el.textContent = contentText(model?.content);
		if (ts) el.title = new Date(ts).toLocaleString();
		log.appendChild(el);
		T.lastKind = "note";
		return;
	}
	if (entry.kind === "chat.message" || entry.kind === "panel.message" || entry.kind === "panel.note") {
		dayMark(ts);
		T.group = null;
		const sender = entry.data?.sender;
		const fallback = entry.kind === "chat.message" ? "用户" : "管理员";
		const who = entry.data?.senderName || senderLabel(sender, fallback);
		const note = entry.kind === "panel.note";
		const el = msgEl(note ? "user inote" : "user", who, ts, sender);
		if (entry.data?.via === "panel" || note) {
			const tag = document.createElement("span");
			tag.className = "tag";
			tag.textContent = note ? "内部指令 · 飞书侧不可见" : entry.kind === "chat.message" ? "经 panel 发到飞书" : "panel";
			el.querySelector(".hd time").before(tag);
		}
		const text = contentText(model?.content);
		// 内部指令的模型文本首行是给模型的来源说明，界面只显示正文
		el.querySelector(".bd").textContent = text;
		log.appendChild(el);
		T.lastKind = "user";
		return;
	}
	if (entry.kind === "pi.assistant") {
		dayMark(ts);
		const parts = model?.content ?? [];
		const thinking = parts.filter((c) => c.type === "thinking" && c.thinking?.trim()).map((c) => c.thinking).join("\n\n");
		const text = parts.filter((c) => c.type === "text").map((c) => c.text).join("");
		if (thinking || text) {
			T.group = null;
			const cont = T.lastKind === "bot" || T.lastKind === "tools";
			const el = msgEl("bot" + (cont ? " cont" : ""), "dwell", ts);
			if (cont) el.querySelector(".hd").remove();
			const bd = el.querySelector(".bd");
			if (thinking) bd.appendChild(thinkEl(thinking));

				const md = document.createElement("div");
				md.className = "md";

				acts.innerHTML = `<button class="btn" data-variant="ghost" data-size="icon-xs" title="复制全文">${ic("copy", "sm")}</button>`;
				acts.firstChild.onclick = (e) => copyText(text, e.currentTarget);
				el.appendChild(acts);
			}
			log.appendChild(el);
			T.lastKind = "bot";
		}
		for (const call of parts.filter((c) => c.type === "toolCall")) addToolRow(call);
		if (model?.stopReason === "error" || model?.stopReason === "aborted") {
			T.group = null;
			const el = msgEl("err", "", ts);
			el.querySelector(".hd").remove();
			el.querySelector(".bd").innerHTML = `${ic("x", "sm")}<span></span>`;
			el.querySelector(".bd span").textContent = model.stopReason === "aborted" ? "已中止" : `模型出错：${model.errorMessage ?? "未知错误"}`;
			log.appendChild(el);
			T.lastKind = "err";
		}
		return;
	}
	if (entry.kind === "pi.tool-result") {
		const row = T.calls.get(model?.toolCallId) ?? addToolRow({ id: model?.toolCallId, name: model?.toolName ?? "tool", arguments: {} });
		const err = model?.isError === true || (entry.data?.diagnostics ?? []).length > 0;
		const out = contentText(model?.content);
		row._out = out;
		row.classList.toggle("bad", err);
		const st = row.querySelector(".st");
		st.className = "st " + (err ? "bad" : "ok");
		st.innerHTML = ic(err ? "x" : "check", "sm");
		const lines = out === "" ? 0 : out.replace(/\n$/, "").split("\n").length;
		const meta = [lines > 0 ? `${lines} 行` : "无输出", model?.durationMs >= 1000 ? `${(model.durationMs / 1000).toFixed(1)}s` : ""].filter(Boolean).join(" · ");

	}
}
function thinkEl(text) {
	const d = document.createElement("details");
	d.className = "think";
	d.innerHTML = `<summary>${ic("chev", "sm")}思考过程 · ${text.length} 字</summary><div class="tx"></div>`;
	d.querySelector(".tx").textContent = text;
	return d;
}
function argSummary(name, a) {
	const s = a?.command ?? a?.path ?? a?.file_path ?? a?.pattern ?? a?.query ?? a?.url ?? (a && Object.keys(a).length > 0 ? JSON.stringify(a) : "");
	return String(s).replace(/\s+/g, " ");
}
function addToolRow(call) {
	if (T.group === null) {
		T.group = document.createElement("div");
		T.group.className = "tools fold";
		$("log").appendChild(T.group);
	}
	const g = T.group;
	const row = document.createElement("details");
	row.className = "tc";
	row.dataset.call = call.id ?? "";
	row._call = call;
	row.innerHTML = `<summary><span class="st"><span class="spin"></span></span><span class="tn"></span><span class="ta"></span><span class="tm"></span></summary><div class="tb"></div>`;
	row.querySelector(".tn").textContent = call.name;
	row.querySelector(".ta").textContent = argSummary(call.name, call.arguments);
	row.addEventListener("toggle", () => { if (row.open) fillToolBody(row); });
	g.appendChild(row);
	if (call.id) T.calls.set(call.id, row);
	updateGroupSummary(g);
	T.lastKind = "tools";
	return row;
}
/** 工具详情懒渲染：展开时才写入参数与输出。 */
function fillToolBody(row) {
	const tb = row.querySelector(".tb");
	const a = row._call.arguments ?? {};
	const argText = typeof a.command === "string" ? a.command : JSON.stringify(a, null, 2);
	const out = row._out;
	const CAP = 20000;
	tb.innerHTML = `<div class="lbl">参数</div><pre class="args"></pre>` + (out === undefined ? `<div class="lbl">运行中…</div>` : `<div class="lbl">输出${out.length > CAP ? `（共 ${out.length} 字符，显示前 ${CAP}）` : ""}</div><pre class="out"></pre>`);
	tb.querySelector(".args").textContent = argText;
	if (out !== undefined) tb.querySelector(".out").textContent = out === "" ? "（无输出）" : out.slice(0, CAP);

function updateGroupSummary(g) {

	let sum = g.querySelector(":scope > .tools-sum");
	g.classList.toggle("many", rows.length >= 3);
	if (rows.length < 3) { sum?.remove(); return; }
	if (!sum) {
		sum = document.createElement("button");
		sum.className = "tools-sum";
		sum.onclick = () => g.classList.toggle("fold");
		g.prepend(sum);
	}
	const count = {};
	for (const r of rows) count[r._call.name] = (count[r._call.name] ?? 0) + 1;
	const detail = Object.entries(count).map(([n, k]) => (k > 1 ? `${n}×${k}` : n)).join("  ");
	sum.innerHTML = `${ic("chev", "sm")}<span>${rows.length} 个工具调用</span><span class="mono">${esc(detail)}</span>`;
}
function applyLive(live) {
	setRunning(live);
	for (const t of live?.tools ?? []) {
		const row = T.calls.get(t.callId);
		if (row && row._out === undefined) row.querySelector(".tm").textContent = t.status === "pending" ? "等待中" : "运行中";
	}

	if (text !== "") {
		if (T.stream === null) {
			const cont = T.lastKind === "bot" || T.lastKind === "tools";
			T.stream = msgEl("bot streaming" + (cont ? " cont" : ""), "dwell", Date.now());
			if (cont) T.stream.querySelector(".hd").remove();
			T.stream.querySelector(".bd").className = "bd md";

function setRunning(live) {

<script>
"use strict";
/* ── 发送 ── */
async function send() {

		$("main").scrollTop = $("main").scrollHeight;

}
/* 发送方式：飞书会话可选「发到飞书」（群里可见，bot 在群里回复）或「内部指令」（只进模型上下文） */
const currentConv = () => convs.find((c) => String(c.id) === String(convId));
const inFeishu = () => Boolean(currentConv()?.chatId);

	$("input").placeholder = !feishu ? "输入消息" : note ? "内部指令：只写入模型上下文，飞书里看不到" : `发到飞书：${where}会看到斜体的「From admin: …」和 bot 的回复`;
	const keys = '<span><kbd class="kbd">Enter</kbd> 发送</span><span><kbd class="kbd">Shift Enter</kbd> 换行</span>';
	$("hint").classList.toggle("busy", running);
	$("hint").innerHTML = !running ? keys : note ? "<span>运行中：内部指令在当前步骤结束后生效</span>" : feishu ? "<span>运行中：消息会发到飞书并插入当前任务</span>" : "<span>运行中：发送的消息会插入当前任务</span>";
}

};
$("unarchive").onclick = () => setArchived(false);
$("copyLinkBtn").onclick = () => { closeMenu(); copyText(`${location.origin}${location.pathname}?conv=${convId}`); };
$("renameBtn").onclick = () => { closeMenu(); sheetPrompt("重命名会话", $("convTitle").textContent, async (name) => {
	try { await api("rename", { id: Number(convId), name }); await loadConvs(true); } catch (e) { toast(e.message, true); }
}); };
$("newConv").onclick = () => sheetPrompt("新建 panel 会话", "", async (name) => {
	const r = await api("conversations", { name }).catch((e) => (toast(e.message, true), null));
	if (r) { await loadConvs(true); drawer(false); switchConv(r.id); }
}, "会话名（可留空）", true);

/* ── 弹层 ── */
function sheetPrompt(title, initial, onOk, placeholder = "", allowEmpty = false) {
	$("sheetTitle").textContent = title;
	$("sheetBody").innerHTML = `
		<input class="input" type="text" id="sheetIn" style="width:100%" maxlength="40">
		<div class="dlg-row">
			<button class="btn" data-variant="outline" data-size="sm" value="cancel" type="submit">取消</button>
			<button class="btn" data-size="sm" id="sheetOk" type="button">确定</button>
		</div>`;
	const input = $("sheetIn");
	input.value = initial ?? "";
	input.placeholder = placeholder;
	$("sheet").showModal();
	input.focus(); input.select();
	$("sheetOk").onclick = () => {
		const v = input.value.trim();
		if (v !== "" || allowEmpty) { $("sheet").close(); onOk(v); }
	};
	input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); $("sheetOk").click(); } });
}

/* ── 审批：当前会话的待审在输入框上方展示完整命令；其他会话列在侧栏并在会话行上打角标 ── */
const apprConv = (a) => Number(String(a.key).split(":")[0]);
function bindApprOps(root, key) {
	for (const b of root.querySelectorAll("button[data-a]")) {
		b.onclick = async () => {
			const action = b.dataset.a === "deny" ? "deny" : "approve";
			const minutes = b.dataset.a === "approve30" ? 30 : 10;
			const r = await api("approve", { key, action, minutes }).catch((e) => ({ ok: false, error: e.message }));
			if (!r.ok) toast(r.error ?? "操作失败", true);
			else toast(action === "approve" ? `已批准 ${minutes} 分钟` : "已拒绝");
			apprSig = "";
			loadApprovals();
		};
	}
}
async function loadApprovals() {
	let list;
	try { list = await api("approvals"); } catch { return; }
	pendingByConv = new Map();
	for (const a of list) pendingByConv.set(apprConv(a), (pendingByConv.get(apprConv(a)) ?? 0) + 1);
	refreshConvMarks();
	const sig = JSON.stringify([convId, list.map((a) => a.key)]);
	if (sig === apprSig) return;
	apprSig = sig;
	const mine = list.find((a) => apprConv(a) === Number(convId));
	$("inlappr").classList.toggle("on", mine !== undefined);
	if (mine !== undefined) {
		$("inlMatch").textContent = `命中规则：${mine.match}`;
		$("inlCmd").textContent = mine.command;
		bindApprOps($("inlappr"), mine.key);
	}
	const others = list.filter((a) => a !== mine);
	$("approvals").hidden = others.length === 0;
	const box = $("apprList");
	box.replaceChildren();
	for (const a of others) {
		const c = convs.find((x) => Number(x.id) === apprConv(a));
		const el = document.createElement("div");
		el.className = "appr";
		el.innerHTML = `<div class="where"><span class="nm"></span><button class="btn" data-variant="ghost" data-size="xs" data-go>查看</button></div><pre></pre>
			<div class="ops">
				<button class="btn" data-size="xs" data-a="approve10">批准 10 分钟</button>
				<button class="btn" data-variant="outline" data-size="xs" data-a="deny" style="color:var(--destructive)">拒绝</button>
			</div>`;
		el.querySelector(".nm").textContent = c ? convTitle(c) : `#${apprConv(a)}`;
		el.querySelector("pre").textContent = a.command;
		el.querySelector("pre").title = a.command;
		el.querySelector("[data-go]").onclick = () => { drawer(false); switchConv(apprConv(a)); };
		bindApprOps(el, a.key);
		box.appendChild(el);
	}
	reflowFloat();
}

/* ── 用户管理 ── */
async function openUsers() {
	const users = await api("users").catch((e) => (toast(e.message, true), null));
	if (users === null) return;
	$("sheetTitle").textContent = "用户管理";
	$("sheetBody").innerHTML = `
		<div style="display:flex;gap:.4rem;margin-bottom:.6rem">
			<input class="input" type="text" id="uId" placeholder="open_id（ou_ 开头）" style="flex:1">
			<button class="btn" data-variant="outline" data-size="sm" id="uAdd" type="button">添加成员</button>
			<button class="btn" data-variant="outline" data-size="sm" id="uAddAdmin" type="button">添加管理员</button>
		</div>
		<div id="uList"></div>
		<div class="dlg-row"><button class="btn" data-variant="outline" data-size="sm" value="cancel" type="submit">关闭</button></div>`;
	const list = $("uList");
	if (users.length === 0) list.innerHTML = `<div class="side-empty">暂无用户</div>`;
	for (const u of users) {
		const row = document.createElement("div");
		row.className = "urow";
		row.innerHTML = `<span class="av"></span><div class="who"><div></div><small></small></div>
			<span class="role${u.role === "admin" ? " admin" : ""}">${u.role === "admin" ? "管理员" : "成员"}</span>
			<button class="btn" data-variant="ghost" data-size="icon-xs" title="移除" type="button">${ic("x", "sm")}</button>`;
		row.querySelector(".who div").textContent = u.name ?? "（未获取到姓名）";
		row.querySelector(".av").textContent = u.name ? initial(u.name) : "?";
		row.querySelector(".who small").textContent = u.id;
		row.querySelector("button").onclick = (e) => armConfirm(e.currentTarget, async () => {
			try { await api("users", { id: u.id, action: "remove" }); openUsers(); } catch (err) { toast(err.message, true); }
		}, "移除?");
		list.appendChild(row);
	}
	if (!$("sheet").open) $("sheet").showModal();
	const add = async (role) => {
		const id = $("uId").value.trim();
		if (!/^ou_\w+$/.test(id)) { toast("需要 ou_ 开头的 open_id", true); return; }
		try { await api("users", { id, role }); openUsers(); } catch (e) { toast(e.message, true); }
	};
	$("uAdd").onclick = () => add("member");
	$("uAddAdmin").onclick = () => add("admin");
}
$("usersBtn").onclick = openUsers;

/* ── 快捷键：Ctrl/⌘+K 搜索会话，Esc 关闭菜单/抽屉/清空搜索 ── */
document.addEventListener("keydown", (e) => {
	if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
		e.preventDefault();
		drawer(true);
		$("q").focus(); $("q").select();
		return;
	}
	if (e.key === "Escape" && !$("sheet").open) {
		if (!$("menu").hidden) { closeMenu(); return; }
		if (document.activeElement === $("q") && $("q").value !== "") { $("q").value = ""; loadConvs(true); return; }
		if (document.body.classList.contains("side-open")) { drawer(false); return; }
		if (document.activeElement === $("q")) $("input").focus();
	}
});
$("q").addEventListener("keydown", (e) => {
	if (e.key === "Enter") {
		const first = $("convlist").querySelector(".conv");
		if (first) { first.click(); $("q").value = ""; loadConvs(true); }
	}
});

/* ── 回到底部浮标 ── */
const main = $("main");
main.addEventListener("scroll", () => {
	$("tobottom").classList.toggle("on", main.scrollHeight - main.scrollTop - main.clientHeight > 240);
});
$("tobottom").onclick = () => main.scrollTo({ top: main.scrollHeight, behavior: "smooth" });
const reflowFloat = () => { $("tobottom").style.bottom = (document.querySelector(".dock").offsetHeight + 14) + "px"; };
new ResizeObserver(reflowFloat).observe(document.querySelector(".dock"));

setInterval(() => { loadApprovals(); loadConvs(true).catch(() => {}); }, 5000);
loadConvs().then(loadApprovals).catch((e) => { setStatus(false); toast("加载会话失败 " + e.message, true); });
</script>
